<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浩劫 · 双人对战棋</title>
<style>
/*__STYLE__*/
</style>
</head>
<body>
<div id="app">

  <!-- ═══ 顶部：双方基地血条与回合信息 ═══ -->
  <header id="topbar">
    <div class="side side-p1" id="side-p1">
      <span class="side-name">❄ 蓝方（玩家一）</span>
      <div class="basebar"><div class="basebar-fill" id="hp-p1"></div><span class="basebar-text" id="hp-p1-text"></span></div>
    </div>
    <div id="turnbox">
      <div id="turn-num">回合 1</div>
      <div id="turn-owner">—</div>
    </div>
    <div class="side side-p2" id="side-p2">
      <div class="basebar"><div class="basebar-fill" id="hp-p2"></div><span class="basebar-text" id="hp-p2-text"></span></div>
      <span class="side-name">红方（玩家二） 🔥</span>
    </div>
  </header>

  <!-- ═══ 主区：棋盘 + 侧面板 ═══ -->
  <main id="layout">
    <section id="boardwrap">
      <div id="board-outer">
        <div id="board"></div>
        <div id="fxlayer"></div>
        <div id="banner" class="hidden"></div>
      </div>
    </section>

    <aside id="panel">
      <div id="phasehint">—</div>

      <div class="panel-block" id="hand-block">
        <div class="block-title">📜 本回合召唤 <span class="block-sub">随从必须部署 / 法术可释放或储存</span></div>
        <div id="hand" class="cardrow"></div>
      </div>

      <div class="panel-block" id="stored-block">
        <div class="block-title">🧪 法术储存栏 <span class="block-sub">点击释放，期限耗尽即销毁</span></div>
        <div id="stored" class="cardrow"></div>
      </div>

      <div class="panel-block" id="inspect-block">
        <div class="block-title">🔍 棋子详情 <span class="block-sub">点击场上棋子查看</span></div>
        <div id="inspect"><div class="empty-hint">暂无选中棋子</div></div>
      </div>

      <div id="skillbox"></div>

      <div id="btns">
        <button id="btn-end" class="btn btn-primary">⏭ 结束回合</button>
        <button id="btn-undo" class="btn">↩ 悔棋</button>
        <button id="btn-codex" class="btn">📖 图鉴</button>
        <button id="btn-rules" class="btn">📐 规则</button>
        <button id="btn-restart" class="btn btn-danger">⟳ 重开</button>
      </div>

      <div id="logwrap">
        <div class="block-title">🗒 战报</div>
        <div id="log"></div>
      </div>
    </aside>
  </main>
</div>

<!-- ═══ 图鉴 / 规则 模态框 ═══ -->
<div id="modal" class="hidden">
  <div id="modal-card">
    <div id="modal-head">
      <div id="modal-title">图鉴</div>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-tabs">
      <button data-tab="codex" class="mtab active">📖 棋子图鉴</button>
      <button data-tab="rules" class="mtab">📐 游戏规则</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
//__SCRIPTS__
</script>
</body>
</html>
