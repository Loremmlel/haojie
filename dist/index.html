hort:`始终占据 2×2 四格；移动需先蓄势一回合。`,desc:`始终站四格（2×2 整体）。选择【移动】时第一次为蓄势（获得蓄力条，不移动）；有蓄力条时再选【移动】才可以整体平移一格，移动后蓄力条清零。（攻击范围从其覆盖四格中最近处计算。）`},{id:6,name:`BUFF怪`,emoji:`📣`,type:`follower`,atk:20,hp:20,rng:4,acts:1,mv:1,short:`技能：令射程内友方下回合 +10 攻击。`,desc:`技能（消耗一次行动）：使攻击范围内一名友方棋子在下个自己的回合获得 +10 攻击力。对 10 号投石机不生效。`},{id:7,name:`钩子`,emoji:`🪝`,type:`follower`,atk:30,hp:55,rng:3,acts:1,mv:1,short:`技能：把射程内一名敌方棋子钩到自己身边。`,desc:`技能（消耗一次行动）：在攻击范围内选择一名敌方棋子，将其拉到钩子周围一圈的任意空格中（由你指定落点）。不能作用于基地。`},{id:8,name:`爆弹`,emoji:`💣`,type:`spell`,limit:4,atk:0,hp:0,rng:0,acts:0,mv:0,short:`对一个“田”字格（2×2）所有目标造成 20 伤害。`,desc:`法术：对一个“田”字格（2×2 区域）内的所有目标（棋子或基地）各造成 20 伤害。储存限制：4 回合。`},{id:9,name:`射手`,emoji:`🏹`,type:`follower`,atk:10,hp:45,rng:5,acts:2,mv:1,short:`一回合两次攻击不可指定同一目标。`,desc:`一回合内如果选择两次攻击，则不能攻击同一目标。`},{id:10,name:`投石机`,emoji:`🪨`,type:`follower`,atk:0,hp:20,rng:100,acts:2,mv:1,short:`全场投石挂标记，标记引爆时造成 5 伤害。`,desc:`攻击力 0、射程覆盖全场：命中者获得存在一回合的标记。标记在被标记者回满血、或再次被标记方的另一枚非投石机棋子命中时触发，造成 5 点伤害。不受 BUFF怪增益。`},{id:11,name:`白嫖怪`,emoji:`🆓`,type:`follower`,atk:20,hp:20,rng:4,acts:1,mv:1,short:`死亡时，你下回合额外召唤一枚棋子。`,desc:`死亡时，其拥有者下个回合开始可以额外进行一次召唤（多抽并部署一张）。`},{id:12,name:`跑得快`,emoji:`👟`,type:`follower`,atk:5,hp:1,rng:6,acts:2,mv:2,short:`贴脸被减速减攻速；死亡留下墓地阻挡。`,desc:`当距任意敌方棋子 1 格时，−1 移速、−1 攻速（行动次数）。死亡时在其位置生成一座 70 血量的墓地（视为 0/70/0/0/0 的己方单位，占格、可被摧毁）。`},{id:13,name:`直行侠`,emoji:`➡️`,type:`follower`,atk:25,hp:35,rng:4,acts:1,mv:3,short:`每次移动必须直线冲整整三格。`,desc:`移动时必须直线移动三格（横向或纵向），中途不可转向、途经格必须全空。`},{id:14,name:`献祭炮`,emoji:`🔥`,type:`follower`,atk:0,hp:30,rng:3,acts:1,mv:1,short:`献祭友方，向某一列的第一个敌人倾泻其攻击力。`,desc:`技能（消耗一次行动）：扣除自己 10 点血量上限，消灭射程内一名友方棋子（不含自身），然后对射程覆盖的任一列上距自己最近的敌方单位（含基地）造成等同于死亡友方攻击力的伤害。`},{id:15,name:`蓄力怪`,emoji:`🔋`,type:`follower`,atk:5,hp:30,rng:2,acts:2,mv:1,short:`技能三选三：+10 攻 或 +1 射程，限三次。`,desc:`技能（消耗一次行动）：选择 +10 攻击力或 +1 攻击范围。该技能整场只能使用 3 次。`},{id:16,name:`伤害转化器`,emoji:`🔄`,type:`follower`,atk:5,hp:100,rng:2,acts:1,mv:1,short:`可以被友方攻击；受友伤时反弹等量伤害给周围敌人。`,desc:`可以被友方棋子指定为攻击目标。每受到一次来自友方棋子的伤害，立即对攻击范围内所有敌方单位造成等量伤害（该反弹不会再触发其他转化器）。`},{id:17,name:`金身`,emoji:`🛡️`,type:`spell`,limit:100,atk:0,hp:0,rng:0,acts:0,mv:0,short:`友方免疫一切伤害直到你的下回合开始。`,desc:`法术：使一名友方棋子直到你的下回合开始不受任何伤害。储存限制：100 回合。`},{id:18,name:`死吧！`,emoji:`💀`,type:`spell`,limit:7,atk:0,hp:0,rng:0,acts:0,mv:0,short:`友方下回合命中的第一个敌方立即死亡。`,desc:`法术：使一名友方获得效果——在你的下个回合，它攻击命中的第一个敌方棋子立即死亡（金身可抵挡；对基地无效）。储存限制：7 回合。`},{id:19,name:`路障小法师`,emoji:`🚧`,type:`follower`,atk:20,hp:30,rng:4,acts:1,mv:1,short:`技能：召唤一个只能活到你下回合的路障。`,desc:`技能（消耗一次行动）：在攻击范围内的空格生成一个己方单位 0/50/0/0/0，该单位会在你的下个回合开始时死亡。`},{id:20,name:`超级跑得快`,emoji:`💥`,type:`follower`,atk:20,hp:20,rng:2,acts:2,mv:2,short:`被敌方击杀时反咬击杀者 20 伤害。`,desc:`若被敌方棋子击杀，则对击杀者造成 20 伤害。`},{id:21,name:`神行千里`,emoji:`🌀`,type:`follower`,atk:30,hp:35,rng:3,acts:1,mv:1,short:`蓄气两回合后：扣 10 血瞬移六格并出手一次。`,desc:`行动可选【蓄气】或【神行】（蓄气≥2 可发动）：发动时扣自己 10 血，随后移动最多 6 格（落点任意可达空格），然后可以进行一次攻击。神行后蓄气清空。`},{id:22,name:`策反`,emoji:`🎭`,type:`spell`,limit:3,atk:0,hp:0,rng:0,acts:0,mv:0,short:`友方下回合首次受击时，收编攻击者！`,desc:`法术：使一名友方获得效果——到你的下回合开始前，第一次对其造成伤害的敌方棋子将变为你的友方棋子（本回合剩余行动作废）。储存限制：3 回合。`},{id:23,name:`独行侠`,emoji:`🧍`,type:`follower`,atk:5,hp:30,rng:5,acts:6,mv:1,short:`两回合一动、爆发六次；周围一圈禁入友军。`,desc:`每隔一个自己的回合才能行动一次（行动回合拥有 6 次行动）。其周围一圈不可部署友方棋子，友方棋子也不能移动至其周围一格（敌方不受限）。`},{id:24,name:`厚脸皮`,emoji:`🐢`,type:`follower`,atk:10,hp:50,rng:4,acts:1,mv:1,short:`正面来袭的伤害最多只有 10。`,desc:`受到来自正面的伤害时，该伤害最多为 10。（正面＝攻击路径朝向与其己方基地一致，即从前线方向打来；背后偷袭全额。）`},{id:25,name:`重铸`,emoji:`♻️`,type:`spell`,limit:7,atk:0,hp:0,rng:0,acts:0,mv:0,short:`召唤一次；或献祭两名过半血友方召唤两次。`,desc:`法术二选一：① 选择召唤一次（随机抽取一枚：随从立即部署，法术自动入库）；② 消灭两个血量不少于上限一半的友方棋子，召唤两次。储存限制：7 回合。`},{id:26,name:`杀手`,emoji:`🔪`,type:`follower`,atk:20,hp:45,rng:4,acts:1,mv:1,short:`连续击杀循环升级：+血 →+攻 →+射程。`,desc:`每击杀一个敌方棋子按次序升级：① +10 血量并回复 10 血；② +5 攻击力；③ +1 攻击范围；④ +10 血量并回复 10 血……之后循环。`}],po={id:-1,name:`基地`,emoji:`🏰`,type:`base`,atk:0,hp:300,rng:0,acts:0,mv:0,short:`核心建筑，300 血，被摧毁即告负。`,desc:`双方的大本营，300 血量，血量归零的一方判负。占据 (5,1) 与 (5,13)。`},mo={id:-2,name:`墓地`,emoji:`⚰️`,type:`grave`,atk:0,hp:70,rng:0,acts:0,mv:0,short:`跑得快的遗骸，0/70 的障碍物。`,desc:`由跑得快死亡生成，视为 0/70/0/0/0
