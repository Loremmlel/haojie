  pieces: myFollowers(state, owner).filter((q) => getDef(q.defId).type === 'follower'),
  hint: '选择一名友方：你的下回合它命中的第一个敌方棋子立即死亡',
});
CAST[18] = async (state, owner, got) => {
  got.reaperFrom = state.turnCounter + 2;
  got.reaperTo = state.turnCounter + 2;
  ev('spell', { defId: 18, uid: got.uid });
  pushLog(state, `💀 死吧！【${getDef(got.defId).name}】眼中燃起幽光——你下回合它命中的第一个敌方将立即死亡。`, 'l-impt');
};

/* ── 22 策反 ── */
SPELL_TARGETS[22] = (state, owner) => ({
  kind: 'piece',
  pieces: myFollowers(state, owner),
  hint: '选择一名友方：到你的下回合开始前，首次攻击它的敌人将被策反',
});
CAST[22] = async (state, owner, got) => {
  got.charmFrom = state.turnCounter + 1;
  got.charmTo = state.turnCounter + 2;
  ev('spell', { defId: 22, uid: got.uid });
  pushLog(state, `🎭 策反陷阱布下！【${getDef(got.defId).name}】静待敌人自投罗网。`, 'l-impt');
};

/* ── 25 重铸 ── */
SPELL_TARGETS[25] = () => ({
  kind: 'option',
  options: [
    { label: '♻️ 召唤一次', value: 'one' },
    { label: '⚔️ 献祭两召', value: 'two' },
  ],
  hint: '重铸：直接召唤一次；或消灭两名血量≥上限一半的友方棋子，召唤两次',
});
CAST[25] = async (state, owner, got) => {
  if (got === 'one') {
    await summonOnce(state, owner);
    return;
  }
  // 献祭双召
  const eligible = myFollowers(state, owner)
    .filter((q) => getDef(q.defId).type === 'follower' && q.hp >= q.maxHp / 2);
  if (eligible.length < 2) {
    pushLog(state, '♻️ 血量过半的友方不足两名，献祭失败（法术仍被消耗）。');
    return;
  }
  for (let i = 0; i < 2; i++) {
    const pool = myFollowers(state, owner)
      .filter((q) => getDef(q.defId).type === 'follower' && q.hp >= q.maxHp / 2 && !q.dead);
    if (!pool.length) break;
    const v = await ENV.choose({ kind: 'piece', pieces: pool, hint: `选择第 ${i + 1} 名献祭的友方棋子` });
    if (!v) break;
    await killPiece(state, v, null);
  }
  await flushDeaths(state);
  await summonOnce(state, owner);
  if (state.winner == null) await summonOnce(state, owner);
};

/** 抽一枚并处理（随从→部署 / 法术→入库）。供 25 号使用。 */
async function summonOnce(state, owner) {
  let defId = rndInt(state, 1, 26);
  if (defId === 3 && rnd(state) >= 1 / 3) defId = 33; // 名刀形态判定
  const def = getDef(defId);
  pushLog(state, `♻️ 重铸召唤：【${def.name}】${def.emoji}`, 'l-impt');
  if (def.type === 'spell') {
    state.stored[owner].push({ defId, remain: def.limit });
    pushLog(state, `📜 法术【${def.name}】自动存入储存栏（期限 ${def.limit} 回合）。`);
    return;
  }
  const cells = deployCells(state, defId, owner);
  if (!cells.length) { pushLog(state, `⚠️ 无处可部署【${def.name}】，被迫放弃。`); return; }
  const spot = await ENV.choose({
    kind: 'cell', cells,
    hint: `为重铸召唤的【${def.name}】选择部署位置`,
  });
  deployPiece(state, owner, defId, spot.x, spot.y);
}


/* ═══════════════ game.js · 回合流程 & 动作 API ═══════════════
 * 所有玩家操作入口都遵循同一节奏：
 *    snap() 快照（供悔棋） → 校验 → 执行 → 结算遗言 → 检查胜负
 * ═════════════════════════════════════════════════════════════ */

/** 抽牌（名刀抽到时立即进行形态判定，手牌中直接呈现最终形态） */
function drawCards(state, owner, n) {
  for (let i = 0; i < n; i++) {
    let defId = rndInt(state, 1, 26);
    if (defId === 3 && rnd(state) >= 1 / 3) defId = 33;
    state.hand[owner].push({ uid: ++state.uidSeq, defId });
    const def = getDef(defId);
    pushLog(state, `${PNAME[owner]}召唤了【${def.name}】${def.emoji}${def.type === 'spell' ? '（法术）' : ''}`);
  }
}

/** 底层部署：放置棋子并处理冲锋询问 */
async function deployPiece(state, owner, defId, x, y) {
  const p = makePiece(state, owner, defId, x, y);
  state.pieces.push(p);
  ev('deploy', { uid: p.uid });
  pushLog(state, `${PNAME[owner]}部署【${getDef(defId).name}】于 (${x},${y})`);
  if (defId === 1) {
    const choice = await ENV.choose({
      kind: 'option',
      options: [
        { label: '⚡ 获得冲锋（−10 血）', value: 'charge' },
        { label: '🛡️ 保持满血', value: 'normal' },
      ],
      hint: '冲锋怪：是否牺牲 10 血量换取部署当回合即可行动？',
    });
    if (choice === 'charge') {
      p.hp -= 10;
      p.justDeployed = false;
      p.apLeft = effActions(p);
      pushLog(state, '⚔️ 冲锋怪嘶吼着冲入了战场！（本回合即可行动）', 'l-impt');
      ev('buff', { uid: p.uid });
    }
  }
  return p;
}

/** 部署阶段 → 行动阶段推进 */
function checkPhaseAdvance() {
  if (S.phase === 'deploy' && S.hand[S.curPlayer].length === 0 && !S.winner) {
    S.phase = 'action';
    ev('phase', { phase: 'action' });
  }
}

/* ─────────── 回合流转 ─────────── */

async function startTurnInternal() {
  S.turnCounter++;
  const me = S.curPlayer;

  // 全局时效清理（标记 / 金身 / 斩杀 / 策反 / 攻击增益 / 到期单位）
  for (const p of S.pieces) {
    if (p.dead) continue;
    if (p.mark10 && S.turnCounter >= p.mark10.expires) p.mark10 = null;
    if (p.shieldUntil && S.turnCounter >= p.shieldUntil) p.shieldUntil = 0;
    if (p.reaperTo && S.turnCounter > p.reaperTo) { p.reaperFrom = 0; p.reaperTo = 0; }
    if (p.charmTo && S.turnCounter >= p.charmTo) { p.charmFrom = 0; p.charmTo = 0; }
    if (p.atkBuffs.length) p.atkBuffs = p.atkBuffs.filter((b) => b.until > S.turnCounter);
    if (p.diesAt && S.turnCounter >= p.diesAt) {
      pushLog(S, `⌛ 【${getDef(p.defId).name}】的召唤物耗尽了时限，化为尘埃。`);
      await killPiece(S, p, null);
    }
  }
  await flushDeaths(S);

  // 己方棋子：节拍推进 + 行动次数重置
  for (const p of S.pieces) {
    if (p.dead || p.owner !== me) continue;
    p.justDeployed = false;
    if (p.defId === 23) p.beatCount++;
    p.apLeft = effActions(p);
    p.hitThisTurn = [];
  }

  computeExtraRows(S, me);

  // 储存栏期限递减（remain < 0 销毁）
  const kept = [];
  for (const card of S.stored[me]) {
    card.remain--;
    if (card.remain < 0) {
      pushLog(S, `⌛ 法术【${getDef(card.defId).name}】超过储存期限，消散了……`, 'l-impt');
      ev('expire', { owner: me });
    } else kept.push(card);
  }
  S.stored[me] = kept;

  // 抽牌：基础 2 张 + 白嫖怪加成
  const n = 2 + S.extraDraw[me];
  S.extraDraw[me] = 0;
  drawCards(S, me, n);

  S.phase = 'deploy';
  ev('turn', { player: me, turn: S.turnCounter });
  checkPhaseAdvance();
}

async function endTurn() {
  if (!S || S.winner != null) return;
  if (S.phase !== 'action') return;
  snap();
  S.hand[S.curPlayer] = [];
  S.curPlayer = 1 - S.curPlayer;
  await startTurnInternal();
}

/* ─────────── 部署阶段动作 ─────────── */

async function deployFollower(handIdx, x, y) {
  const card = S.hand[S.curPlayer][handIdx];
  if (!card || getDef(card.defId).type === 'spell') return false;
  if (!canDeployAt(S, card.defId, S.curPlayer, x, y)) return false;
  snap();
  S.hand[S.curPlayer].splice(handIdx, 1);
  await deployPiece(S, S.curPlayer, card.defId, x, y);
  checkPhaseAdvance();
  return true;
}

/** 无处可放的随从被迫弃置（仅当没有合法位置时允许） */
function discardUnplaceable(handIdx) {
  const card = S.hand[S.curPlayer][handIdx];
  if (!card || getDef(card.defId).type === 'spell') return false;
  if (deployCells(S, card.defId, S.curPlayer).length > 0) return false;
  snap();
  S.hand[S.curPlayer].splice(handIdx, 1);
  pushLog(S, `⚠️ 战场无处安放【${getDef(card.defId).name}】，只能忍痛放弃。`, 'l-impt');
  checkPhaseAdvance();
  return true;
}

async function storeHandSpell(handIdx) {
  const card = S.hand[S.curPlayer][handIdx];
  if (!card || getDef(card.defId).type !== 'spell') return false;
  snap();
  S.hand[S.curPlayer].splice(handIdx, 1);
  S.stored[S.curPlayer].push({ defId: card.defId, remain: getDef(card.defId).limit });
  pushLog(S, `🧪 【${getDef(card.defId).name}】存入储存栏（期限 ${getDef(card.defId).limit} 回合）。`);
  checkPhaseAdvance();
  return true;
}

async function castHandSpell(handIdx, got) {
  const card = S.hand[S.curPlayer][handIdx];
  if (!card || getDef(card.defId).type !== 'spell') return false;
  snap();
  S.hand[S.curPlayer].splice(handIdx, 1);
  await CAST[card.defId](S, S.curPlayer, got);
  await flushDeaths(S);
  checkWin(S);
  checkPhaseAdvance();
  return true;
}

async function castStored(idx, got) {
  const card = S.stored[S.curPlayer][idx];
  if (!card) return false;
  snap();
  S.stored[S.curPlayer].splice(idx, 1);
  pushLog(S, `✨ ${PNAME[S.curPlayer]}释放了储存的法术【${getDef(card.defId).name}】！`, 'l-impt');
  await CAST[card.defId](S, S.curPlayer, got);
  await flushDeaths(S);
  checkWin(S);
  return true;
}

/* ─────────── 行动阶段动作 ─────────── */

async function doMove(uid, x, y) {
  const p = pieceByUid(S, uid);
  if (!p || p.owner !== S.curPlayer || S.phase !== 'action') return false;
  if (p.justDeployed || p.apLeft <= 0) return false;

  // 大肉比：先蓄势再平移
  if (p.defId === 5) {
    if (p.charge <= 0) {
      snap();
      p.charge = 1;
      p.apLeft--;
      ev('buff', { uid: p.uid });
      pushLog(S, '🐘 大肉比深深蓄势……下次选择移动才会真正挪动！');
      return true;
    }
    const legal = moveTargets(S, p).some((c) => c.x === x && c.y === y);
    if (!legal) return false;
    snap();
    p.charge = 0;
    ev('move', { uid: p.uid, tx: x, ty: y });
    p.x = x; p.y = y;
    p.apLeft--;
    pushLog(S, `🐘 大肉比轰隆隆地挪到了 (${x},${y})！`);
    return true;
  }

  const legal = moveTargets(S, p).some((c) => c.x === x && c.y === y);
  if (!legal) return false;
  snap();
  ev('move', { uid: p.uid, tx: x, ty: y });
  p.x = x; p.y = y;
  p.apLeft--;
  return true;
}

/**
 * 攻击核心：结算即死斩杀 / 冲锋怪掷骰 / 投石机挂标 / 射手记录 / 定炮清充能
 */
async function performAttack(state, p, target) {
  ev('attack', { uid: p.uid, tuid: target.uid });

  // ── 死吧！：下回合命中的第一个敌方立即死亡
  if (p.reaperFrom && state.turnCounter === p.reaperFrom &&
      getDef(target.defId).type !== 'base') {
    p.reaperFrom = 0; p.reaperTo = 0;
    if (target.shieldUntil > state.turnCounter) {
      pushLog(state, `💀 斩杀之光撞上了金身！【${getDef(target.defId).name}】侥幸存活！`, 'l-impt');
    } else {
      pushLog(state, `💀 死吧！！【${getDef(target.defId).name}】当场毙命！`, 'l-impt');
      await killPiece(state, target, p);
      await flushDeaths(state);
      checkWin(state);
      return;
    }
  }

  // ── 伤害掷骰
  let dmg = effAtk(p);
  let crit = false;
  if (p.defId === 1) {
    const r = rnd(state);
    if (r < 1 / 12) { dmg += 60; crit = true; }
    else if (r < 1 / 4) { dmg += 20; }
  }

  // ── 投石机：零伤挂标
  if (p.defId === 10) {
    pushLog(state, `🪨 投石机砸中了【${getDef(target.defId).name}】，附上引信标记！`);
    if (!target.dead) {
      target.mark10 = { owner: p.owner, srcUid: p.uid, expires: state.turnCounter + 2 };
      ev('mark', { uid: target.uid });
    }
  } else {
    await dealDamage(state, target, dmg, p, { hit: true, crit });
  }

  if (p.defId === 9) p.hitThisTurn.push(target.uid);
  if (p.defId === 4) p.charge = 0;
  await flushDeaths(state);
  checkWin(state);
}

async function doAttack(uid, targetUid) {
  const p = pieceByUid(S, uid);
  const t = pieceByUid(S, targetUid);
  if (!p || !t || p.owner !== S.curPlayer || S.phase !== 'action') return false;
  if (p.justDeployed || p.apLeft <= 0) return false;

  // 奶妈：可指定己方残血棋子改为治疗
  if (p.defId === 2 && t.owner === p.owner) {
    if (t.hp >= t.maxHp) return false;
    if (nearestDist(p, t) > p.range) return false;
    snap();
    p.apLeft--;
    pushLog(S, `💉 奶妈为【${getDef(t.defId).name}】回复了 20 血量。`);
    ev('attack', { uid: p.uid, tuid: t.uid, healMode: true });
    await heal(S, t, 20);
    return true;
  }

  if (!attackTargets(S, p).includes(t)) return false;
  snap();
  p.apLeft--;
  await performAttack(S, p, t);
  return true;
}

async function useSkill(uid) {
  const p = pieceByUid(S, uid);
  const sk = SKILLS[p.defId];
  if (!p || !sk || p.owner !== S.curPlayer || S.phase !== 'action') return false;
  if (p.justDeployed || p.apLeft <= 0 || !sk.usable(p)) return false;
  const spec = sk.targetSpec(S, p);
  let got = null;
  if (spec.kind !== 'none') {
    got = await ENV.choose(spec);
    if (got == null) return false; // 玩家取消了
  }
  snap();
  p.apLeft--;
  await sk.exec(S, p, got);
  await flushDeaths(S);
  checkWin(S);
  return true;
}

/* ═════════════ 对外 API ═════════════ */

const API = {
  async init(seed) {
    newGame(seed);
    S.curPlayer = rnd(S) < 0.5 ? 0 : 1;
    pushLog(S, `🎲 天命所归：${PNAME[S.curPlayer]}执掌先行之权！`, 'l-impt');
    await startTurnInternal();
    return S;
  },
  state: () => S,
  getDef,
  spellTargets: SPELL_TARGETS,
  canUndo,
  async undo() {
    if (!canUndo()) return false;
    undo();
    return true;
  },
  undoDepth: () => undoStack.length,

  // 部署阶段
  deployFollower,
  discardUnplaceable,
  storeHandSpell,
  castHandSpell,
  castStored,

  // 行动阶段
  doMove,
  doAttack,
  useSkill,
  endTurn,

  // 规则查询（供 UI 高亮）
  rules: {
    moveTargets: (p) => moveTargets(S, p),
    attackTargets: (p) => attackTargets(S, p),
    healTargets: (p) => healTargets(S, p),
    deployCells: (defId, owner) => deployCells(S, defId, owner),
    skillInfo: (p) => SKILLS[p.defId] || null,
    effActions,
    effRange: (p) => effRange(p),
    bigCharge: (p) => p.charge,
  },

  // 表现层注入点（测试环境替换 choose）
  env: ENV,
};

// 测试环境导出钩子（浏览器 IIFE 中 __HAOJIE_EXPORT__ 未定义则跳过）
if (typeof __HAOJIE_EXPORT__ === 'function') __HAOJIE_EXPORT__(API);


/* ═══════════════ fx.js · 特效引擎 ═══════════════
 * 消费事件队列 EV，把逻辑层的每次动作翻译成动画。
 * 所有动画返回 Promise，由 input 层 await 后再解锁输入。
 * ═══════════════════════════════════════════════ */

const FX = (() => {
  let evCursor = 0;         // EV 已播放游标
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitFrame = () => new Promise((r) => requestAnimationFrame(r));

  /** 格子几何：由 ui.js 在布局后调用 setMetrics 更新 */
  let M = { size: 48, gap: 3, pad: 10, originX: 0, originY: 0 };
  function setMetrics(m) { M = m; }

  /** 格子中心相对 #board-outer 的像素坐标 */
  function centerOf(x, y) {
    return {
      cx: M.pad + (x - 0.5) * (M.size + M.gap),
      cy: M.pad + (H - y + 0.5) * (M.size + M.gap), // y=1 渲染在最下行
    };
  }
  function boardOuter() { return document.getElementById('board-outer'); }

  function addEl(cls, styles, text) {
    const layer = document.getElementById('fxlayer');
    const el = document.createElement('div');
    el.className = cls;
    if (text != null) el.textContent = text;
    for (const k in styles) el.style[k] = styles[k];
    layer.appendChild(el);
    return el;
  }

  /* ─────────── 特效原语 ─────────── */

  async function flyNum(uid, text, cls) {
    const pEl = UI.pieceEl(uid);
    const box = boardOuter().getBoundingClientRect();
    const r = pEl ? pEl.getBoundingClientRect() : box;
    const el = addEl('fly-num ' + cls, {
      left: (r.left - box.left + r.width / 2) + 'px',
      top: (r.top - box.top + r.height * 0.35) + 'px',
    }, text);
    await sleep(950);
    el.remove();
  }

  /** 近战冲刺：攻击者扑向目标再弹回 */
  async function lunge(pEl, tEl) {
    const b = boardOuter().getBoundingClientRect();
    const pr = pEl.getBoundingClientRect(), tr = tEl.getBoundingClientRect();
    const dx = (tr.left + tr.width / 2) - (pr.left + pr.width / 2);
    const dy = (tr.top + tr.height / 2) - (pr.top + pr.height / 2);
    pEl.style.transition = 'transform .12s cubic-bezier(.5,0,.8,1)';
    pEl.style.transform = `translate(${dx * 0.55}px, ${dy * 0.55}px) scale(1.08)`;
    pEl.style.zIndex = 15;
    await sleep(120);
    // 斩击线
    const ang = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    const slash = addEl('slash', {
      left: (pr.left - b.left + pr.width / 2 + dx * 0.25 - 26) + 'px',
      top: (pr.top - b.top + pr.height / 2 + dy * 0.25 - 2) + 'px',
      width: '52px', '--rot': ang + 'deg',
    });
    setTimeout(() => slash.remove(), 300);
    pEl.style.transition = 'left .32s cubic-bezier(.34,1.3,.5,1), top .32s cubic-bezier(.34,1.3,.5,1), transform .22s';
    pEl.style.transform = '';
    setTimeout(() => { pEl.style.zIndex = ''; }, 350);
    await sleep(160);
  }

  /** 远程弹道（棋子 → 棋子） */
  async function projectile(fromUid, toUid, color, healMode) {
    const pEl = UI.pieceEl(fromUid), tEl = UI.pieceEl(toUid);
    if (!pEl || !tEl) return;
    const b = boardOuter().getBoundingClientRect();
    const pr = pEl.getBoundingClientRect(), tr = tEl.getBoundingClientRect();
    const x1 = pr.left - b.left + pr.width / 2, y1 = pr.top - b.top + pr.height / 2;
    const x2 = tr.left - b.left + tr.width / 2, y2 = tr.top - b.top + tr.height / 2;
    await projectileTo(x1, y1, x2, y2, color);
    if (!healMode) hitRing(toUid, color || '#f87171');
  }

  /** 远程弹道原语（像素坐标 → 像素坐标） */
  async function projectileTo(x1, y1, x2, y2, color) {
    const dist = Math.hypot(x2 - x1, y2 - y1);
    const dur = Math.min(420, Math.max(140, dist * 1.4));
    const bolt = addEl('bolt', { left: x1 + 'px', top: y1 + 'px', color: color || '#fbbf24' });
    bolt.style.transition = `left ${dur}ms linear, top ${dur}ms linear`;
    void bolt.offsetWidth;
    bolt.style.left = x2 + 'px'; bolt.style.top = y2 + 'px';
    await sleep(dur + 30);
    bolt.remove();
  }

  function hitRing(uid, color) {
    const tEl = UI.pieceEl(uid);
    if (!tEl) return;
    const r = tEl.getBoundingClientRect();
    tEl.classList.remove('hit-jolt'); void tEl.offsetWidth; tEl.classList.add('hit-jolt');
    const ring = addEl('ring', {
      left: (r.left - boardOuter().getBoundingClientRect().left + r.width / 2) + 'px',
      top: (r.top - boardOuter().getBoundingClientRect().top + r.height / 2) + 'px',
      color,
      '--ring-w': r.width * 1.7 + 'px',
    });
    setTimeout(() => ring.remove(), 600);
  }

  /** 爆炸粒子（爆弹/死亡等） */
  function boomAt(px, py, color, n) {
    for (let i = 0; i < (n || 8); i++) {
      const ang = Math.random() * Math.PI * 2;
      const d = 24 + Math.random() * 42;
      const b = addEl('boom', {
        left: px + 'px', top: py + 'px', color,
        background: color,
        '--dx': Math.cos(ang) * d + 'px', '--dy': Math.sin(ang) * d + 'px',
        width: 5 + Math.random() * 7 + 'px', height: 5 + Math.random() * 7 + 'px',
      });
      setTimeout(() => b.remove(), 750);
    }
  }

  async function spellIcon(text, x, y) {
    const { cx, cy } = centerOf(x, y);
    const el = addEl('spell-cast', { left: cx + 'px', top: cy + 'px' }, text);
    await sleep(750);
    el.remove();
  }

  async function banner(text, cls) {
    const el = document.getElementById('banner');
    el.textContent = text;
    el.className = cls || '';
    await sleep(1050);
    el.className = 'hidden';
  }

  function shake() {
    document.body.classList.remove('shake');
    void document.body.offsetWidth;
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 420);
  }

  /* ─────────── 事件 → 动画调度 ─────────── */

  async function playNew() {
    if (evCursor > EV.length) evCursor = 0; // 悔棋清空事件队列后重置游标
    while (evCursor < EV.length) {
      const e = EV[evCursor++];
      try { await playOne(e); } catch (err) { console.error('fx error', e, err); }
    }
  }

  async function playOne(e) {
    switch (e.type) {
      case 'turn': {
        refreshTop(); // 回合横幅期间同步血条
        await banner(`第 ${e.turn} 回合 · ${PNAME[e.player]}行动`, e.player === 0 ? 'b1' : 'b2');
        break;
      }
      case 'deploy': {
        UI.syncPieces(); // 新棋子 pop-in
        break;
      }
      case 'move': {
        UI.movePieceTo(e.uid, e.tx, e.ty);
        await sleep(340);
        break;
      }
      case 'hook': {
        // 钩链飞向目标原位置 → 勾住拉回
        const h = centerOf(e.fx, e.fy), t = centerOf(e.x0, e.y0);
        await projectileTo(h.cx, h.cy, t.cx, t.cy, '#fda4af');
        UI.movePieceTo(e.uid, e.tx, e.ty);
        await sleep(340);
        break;
      }
      case 'attack': {
        const atkP = API.state().pieces.find((q) => q.uid === e.uid);
        const tEl = UI.pieceEl(e.tuid);
        if (!atkP || !tEl) break;
        if (e.healMode) { await projectile(e.uid, e.tuid, '#34d399', true); break; }
        const isRanged = nearestDist(
          atkP,
          API.state().pieces.find((q) => q.uid === e.tuid)
        ) > 1;
        UI.syncStatFlash(atkP.uid);
        if (isRanged) await projectile(e.uid, e.tuid, '#fbbf24');
        else await lunge(UI.pieceEl(e.uid), tEl);
        break;
      }
      case 'damage': {
        const st = API.state();
        const victim = st.pieces.find((q) => q.uid === e.uid);
        if (victim && !e.silentNum) {
          await flyNum(e.uid, '-' + e.amount + (e.frontal ? '（正面）' : ''), e.crit ? 'crit' : 'dmg');
          if (e.amount >= 60 || e.crit) shake();
        }
        break;
      }
      case 'heal': {
        await flyNum(e.uid, '+' + e.amount, 'heal');
        break;
      }
      case 'buff': {
        await flyNum(e.uid, '▲ 强化', 'buff');
        break;
      }
      case 'guard': {
        const tEl = UI.pieceEl(e.uid);
        if (tEl) {
          const r = tEl.getBoundingClientRect();
          boomAt(r.left - boardOuter().getBoundingClientRect().left + r.width / 2,
                 r.top - boardOuter().getBoundingClientRect().top + r.height / 2,
                 '#7dd3fc', 10);
        }
        await flyNum(e.uid, '🗡️ 名刀！', 'buff');
        break;
      }
      case 'block': {
        await flyNum(e.uid, '🛡️ 免疫', 'buff');
        break;
      }
      case 'mark': {
        await flyNum(e.uid, '🎯 引信', 'buff');
        break;
      }
      case 'counter': {
        await flyNum(e.uid, '🔄 反弹！', 'buff');
        shake();
        break;
      }
      case 'charm': {
        await flyNum(e.uid, '🎭 倒戈！', 'buff');
        shake();
        UI.refreshAll();
        break;
      }
      case 'death': {
        const el = UI.pieceEl(e.uid);
        if (el) {
          const r = el.getBoundingClientRect();
          const b = boardOuter().getBoundingClientRect();
          boomAt(r.left - b.left + r.width / 2, r.top - b.top + r.height / 2, getDef(e.defId).type === 'base' ? '#fbbf24' : '#94a3b8', 12);
          el.classList.add('dying');
          await sleep(480);
          el.remove();
        }
        if (getDef(e.defId).type === 'base') shake();
        UI.syncPieces();
        break;
      }
      case 'spell': {
        const def = getDef(e.defId);
        if (e.defId === 8) {
          await spellIcon('💣', e.x + 0.5, e.y + 0.5);
          // 田字四格（锚点为左上格）中心各炸一次
          for (let dx = 0; dx <= 1; dx++) for (let dy = 0; dy <= 1; dy++) {
            const { cx, cy } = centerOf(e.x + dx, e.y + dy);
            boomAt(cx, cy, '#fb923c', 7);
          }
          shake();
          await sleep(250);
        } else if (e.uid != null) {
          const icons = { 17: '🛡️', 18: '💀', 22: '🎭' };
          await spellIcon(icons[e.defId] || def.emoji,
            API.state().pieces.find((q) => q.uid === e.uid)?.x || W / 2,
            API.state().pieces.find((q) => q.uid === e.uid)?.y || H / 2);
        }
        break;
      }
      case 'expire': break;
      case 'win': {
        showWinMask(e.winner);
        break;
      }
      case 'phase': break;
      default: break;
    }
  }

  return { setMetrics, centerOf, playNew, flyNum, boomAt, banner, shake, projectile };
})();


/* ═══════════════ ui.js · 渲染层 ═══════════════
 * 格子层：每次刷新全量重建（无状态、承载高亮）
 * 棋子层：按 uid 做 DOM diff，位移交给 CSS transition 动画
 * ══════════════════════════════════════════════ */

/** 纯 UI 交互状态（不属于游戏状态、不入快照） */
const UIST = {
  mode: 'idle',      // idle | deployCard | pieceSel
  cardIdx: null,     // deployCard：当前手牌索引
  selUid: null,      // pieceSel：选中的己方棋子
  inspectUid: null,  // 详情面板展示的棋子
  choice: null,      // ENV.choose 进行中的 {spec, resolve}
};

const UI = (() => {
  const pieceMap = new Map();   // uid → HTMLElement
  let metrics = null;

  const boardEl = () => document.getElementById('board');

  /* ─────────── 几何 ─────────── */

  function measure() {
    const first = boardEl().querySelector('.cell');
    if (!first) return null;
    const size = first.offsetWidth;
    const next = first.nextElementSibling;
    const gap = next ? next.offsetLeft - first.offsetLeft - size : 3;
    const pad = first.offsetLeft;
    metrics = { size, gap, pad };
    FX.setMetrics(metrics);
    return metrics;
  }

  /** 棋子左上角像素位置 */
  function posOf(x, y, big) {
    const m = metrics || measure() || { size: 48, gap: 3, pad: 10 };
    return {
      left: m.pad + (x - 1) * (m.size + m.gap),
      top: m.pad + (H - y - (big ? 1 : 0)) * (m.size + m.gap),
    };
  }

  /* ─────────── 高亮计算 ─────────── */

  function cellsOfPiece(p) {
    return pieceCells(p).map((c) => c.x + ',' + c.y);
  }

  function computeHighlights() {
    const hl = { dep: [], mv: [], atk: [], sk: [], heal: [], sel: [] };
    const st = API.state();

    // 法术/技能目标选择优先
    if (UIST.choice && UIST.choice.spec) {
      const spec = UIST.choice.spec;
      if (spec.kind === 'cell') hl.sk = spec.cells.map((c) => c.x + ',' + c.y);
      if (spec.kind === 'piece') {
        for (const t of spec.pieces) hl.sk.push(...cellsOfPiece(t));
      }
      return hl;
    }

    if (UIST.mode === 'deployCard' && UIST.cardIdx != null) {
      const card = st.hand[st.curPlayer][UIST.cardIdx];
      if (card) hl.dep = API.rules.deployCells(card.defId, st.curPlayer).map((c) => c.x + ',' + c.y);
      return hl;
    }

    if (UIST.mode === 'pieceSel' && UIST.selUid != null) {
      const p = pieceByUid(st, UIST.selUid);
      if (!p) return hl;
      hl.sel = cellsOfPiece(p);
      const canActNow = st.phase === 'action' && p.owner === st.curPlayer &&
                        !p.justDeployed && p.apLeft > 0;
      if (canActNow) {
        if (p.defId === 5) {
          if (p.charge > 0) hl.mv = API.rules.moveTargets(p).map((c) => c.x + ',' + c.y);
        } else {
          hl.mv = API.rules.moveTargets(p).map((c) => c.x + ',' + c.y);
          for (const t of API.rules.attackTargets(p)) hl.atk.push(...cellsOfPiece(t));
          if (p.defId === 2) for (const t of API.rules.healTargets(p)) hl.heal.push(...cellsOfPiece(t));
        }
      }
    }
    return hl;
  }

  /* ─────────── 格子层 ─────────── */

  function renderCells() {
    const hl = computeHighlights();
    const set = (arr) => new Set(arr);
    const S_dep = set(hl.dep), S_mv = set(hl.mv), S_atk = set(hl.atk),
          S_sk = set(hl.sk), S_heal = set(hl.heal), S_sel = set(hl.sel);

    const frag = document.createDocumentFragment();
    for (let row = 1; row <= H; row++) {
      for (let col = 1; col <= W; col++) {
        const x = col, y = H - row + 1;   // y=1 固定渲染在最下行（蓝方阵地）
        const c = document.createElement('div');
        c.className = 'cell';
        c.dataset.x = x; c.dataset.y = y;
        const key = x + ',' + y;
        const occ = pieceAt(API.state(), x, y);
        if (occ && occ.defId === -1) c.classList.add('base-cell', occ.owner === 0 ? 'p1' : 'p2');
        if (S_dep.has(key)) c.classList.add('dep-ok');
        else {
          if (S_mv.has(key)) c.classList.add('mv-ok');
          if (S_atk.has(key)) c.classList.add('atk-ok');
          if (S_heal.has(key)) c.classList.add('heal-ok');
          if (S_sk.has(key)) c.classList.add('sk-ok');
        }
        if (S_sel.has(key)) c.classList.add('sel-hl');
        frag.appendChild(c);
      }
    }
    const el = boardEl();
    el.innerHTML = '';
    el.appendChild(frag);
  }

  /* ─────────── 棋子层 ─────────── */

  function buildPieceEl(p) {
    const def = getDef(p.defId);
    const el = document.createElement('div');
    el.className = 'piece pop-in';
    el.dataset.uid = p.uid;
    el.innerHTML =
      `<div class="face">${def.emoji}</div>` +
      `<span class="stat atk"></span><span class="stat hp"></span>` +
      `<div class="badges"></div><div class="apdots"></div>`;
    setTimeout(() => el.classList.remove('pop-in'), 500);
    return el;
  }

  function syncStatsOf(p, el) {
    const def = getDef(p.defId);
    const atkEl = el.querySelector('.stat.atk'), hpEl = el.querySelector('.stat.hp');
    if (p.defId < 0) { atkEl.style.display = 'none'; }
    else { atkEl.style.display = ''; atkEl.textContent = effAtk(p); }
    hpEl.textContent = Math.max(0, Math.round(p.hp));
    hpEl.parentElement.classList.toggle('hurt', p.hp <= p.maxHp * 0.35);

    // 徽标
    const badges = [];
    if (p.charge > 0) badges.push('⚡' + p.charge);
    if (p.reaperTo && API.state().turnCounter === p.reaperFrom) badges.push('💀');
    if (p.charmTo && API.state().turnCounter >= p.charmFrom && API.state().turnCounter < p.charmTo) badges.push('🎭');
    el.querySelector('.badges').textContent = badges.join('');

    // 行动点
    const apBox = el.querySelector('.apdots');
    const st = API.state();
    const mine = p.owner === st.curPlayer && st.phase !== 'over';
    const total = effActions(p);
    if (mine && !p.justDeployed && total > 0 && st.phase === 'action') {
      let html = '';
      for (let i = 0; i < total; i++) html += `<span class="apdot ${i < p.apLeft ? '' : 'spent'}"></span>`;
      apBox.innerHTML = html;
    } else apBox.innerHTML = '';

    // 状态外观
    el.classList.toggle('exhausted',
      (p.owner === st.curPlayer && st.phase === 'action' && (p.justDeployed || (p.apLeft <= 0 && total > 0))) ||
      def.type === 'grave');
    el.classList.toggle('shielded', !!p.shieldUntil && p.shieldUntil > st.turnCounter);
    el.classList.toggle('marked', !!p.mark10);
    el.classList.toggle('reapered', !!p.reaperTo && p.reaperFrom <= st.turnCounter);
    el.classList.toggle('charmed', !!p.charmTo && p.charmFrom <= st.turnCounter && p.charmTo > st.turnCounter);
    el.classList.toggle('charged', p.charge >= 2);
    el.classList.toggle('buffed', p.atkBuffs.length > 0);
    el.classList.toggle('selected', UIST.mode === 'pieceSel' && UIST.selUid === p.uid);
    void def;
  }

  /** 棋子层 diff：新建 / 更新 / 移除。
   *  棋子挂在 #board-outer 上（而非 #board 内），这样格子层
   *  的 innerHTML 重建不会连带清掉棋子 DOM。 */
  function syncPieces() {
    const st = API.state();
    const host = document.getElementById('board-outer');
    const alive = new Set();
    for (const p of st.pieces) {
      if (p.dead) continue;
      alive.add(p.uid);
      let el = pieceMap.get(p.uid);
      if (!el) {
        el = buildPieceEl(p);
        pieceMap.set(p.uid, el);
        host.appendChild(el);
      }
      const pos = posOf(p.x, p.y, p.big);
      el.style.left = pos.left + 'px';
      el.style.top = pos.top + 'px';
      el.classList.toggle('own0', p.owner === 0);
      el.classList.toggle('own1', p.owner === 1);
      el.classList.toggle('big5', !!p.big);
      syncStatsOf(p, el);
    }
    for (const [uid, el] of pieceMap) {
      if (!alive.has(uid)) { el.remove(); pieceMap.delete(uid); }
    }
  }

  function movePieceTo(uid, x, y) {
    const p = pieceByUid(API.state(), uid);
    const el = pieceMap.get(uid);
    if (!p || !el) return;
    const pos = posOf(x, y, p.big);
    el.style.left = pos.left + 'px';
    el.style.top = pos.top + 'px';
  }

  function pieceEl(uid) { return pieceMap.get(uid) || null; }

  /* ─────────── 右侧面板 ─────────── */

  function statLine(def) {
    if (def.type === 'spell') return `<span>🧪 法术</span><span>⏳ 储存 ${def.limit} 回合</span>`;
    return `<span>⚔️ <b>${def.atk}</b></span><span>❤️ <b>${def.hp}</b></span>` +
           `<span>🎯 <b>${def.rng}</b></span><span>⚡ <b>${def.acts}</b></span><span>👟 <b>${def.mv}</b></span>`;
  }

  function renderHand() {
    const st = API.state();
    const box = document.getElementById('hand');
    box.innerHTML = '';
    if (st.phase === 'over') { box.innerHTML = '<div class="empty-hint">战斗已结束</div>'; return; }
    const cards = st.hand[st.curPlayer] || [];
    if (st.phase === 'action' && cards.length === 0) {
      box.innerHTML = '<div class="empty-hint">本回合召唤已全部处理完毕</div>';
      return;
    }
    cards.forEach((card, idx) => {
      const def = getDef(card.defId);
      const el = document.createElement('div');
      const isSelected = UIST.mode === 'deployCard' && UIST.cardIdx === idx;
      el.className = 'card' + (def.type === 'spell' ? ' spell-card' : '') +
                     (isSelected ? ' selected' :
                      (st.phase === 'deploy' ? ' awaiting' : ''));
      el.dataset.idx = idx;

      let extra = '';
      if (def.type === 'follower') {
        const n = API.rules.deployCells(card.defId, st.curPlayer).length;
        if (n === 0) extra = '<div class="card-btns"><button class="mini-btn" data-discard="' + idx + '">⚠️ 无处部署 · 弃置</button></div>';
      } else {
        extra =
          `<div class="card-btns">` +
          `<button class="mini-btn purple" data-cast="${idx}">✨ 释放</button>` +
          `<button class="mini-btn gold" data-store="${idx}">🧪 储存</button></div>`;
      }

      el.innerHTML =
        (def.type === 'spell' ? `<span class="c-limit">⏳${def.limit}回合</span>` : '') +
        `<div class="c-head"><span class="c-emoji">${def.emoji}</span><span class="c-name">${def.name}</span></div>` +
        `<div class="c-stats">${statLine(def)}</div>` +
        `<div class="c-desc">${def.short}</div>` + extra;
      box.appendChild(el);
    });
  }

  function renderStored() {
    const st = API.state();
    const box = document.getElementById('stored');
    box.innerHTML = '';
    const arr = st.stored[st.curPlayer] || [];
    if (!arr.length) { box.innerHTML = '<div class="empty-hint">空空如也</div>'; return; }
    arr.forEach((card, idx) => {
      const def = getDef(card.defId);
      const el = document.createElement('div');
      el.className = 'card spell-card';
      el.innerHTML =
        `<span class="c-limit">⏳剩 ${card.remain} 回合</span>` +
        `<div class="c-head"><span class="c-emoji">${def.emoji}</span><span class="c-name">${def.name}</span></div>` +
        `<div class="c-desc">${def.short}</div>` +
        (st.phase === 'action'
          ? `<div class="card-btns"><button class="mini-btn purple" data-cast-stored="${idx}">✨ 释放</button></div>`
          : '');
      box.appendChild(el);
    });
  }

  function statusText(p) {
    const st = API.state();
    const parts = [];
    if (p.charge > 0) parts.push(`⚡蓄力 ${p.charge}`);
    if (p.skillUses > 0) parts.push(`🔋已强化 ${p.skillUses}/3`);
    if (p.killCount > 0) parts.push(`🔪击杀 ${p.killCount}`);
    if (p.shieldUntil > st.turnCounter) parts.push('🛡️金身');
    if (p.mark10) parts.push('🎯引信标记');
    if (p.reaperTo && p.reaperFrom <= st.turnCounter) parts.push('💀斩杀之刃');
    if (p.charmTo && p.charmFrom <= st.turnCounter) parts.push('🎭策反陷阱');
    if (p.guardUsed) parts.push('🗡️守护已耗尽');
    if (p.diesAt) parts.push(`⏳${Math.max(0, p.diesAt - st.turnCounter)} 回合后消散`);
    if (p.justDeployed) parts.push('💤部署当回合，尚待苏醒');
    return parts.length ? `<div class="i-desc">${parts.join(' · ')}</div>` : '';
  }

  function renderInspect() {
    const box = document.getElementById('inspect');
    const p = UIST.inspectUid != null ? pieceByUid(API.state(), UIST.inspectUid) : null;
    if (!p) { box.innerHTML = '<div class="empty-hint">暂无选中棋子</div>'; return; }
    const def = getDef(p.defId);
    box.innerHTML =
      `<div class="i-head"><span class="i-emoji">${def.emoji}</span>` +
      `<span class="i-name">${def.name}</span>` +
      (def.type === 'grave' ? '' :
        `<span class="i-owner o${p.owner}">${PNAME[p.owner]}</span>`) +
      `</div>` +
      `<div class="i-stats">${statLine(def)}<span>📍 <b>${p.x},${p.y}</b></span>` +
      `<span>❤️ <b>${Math.max(0, Math.round(p.hp))}/${p.maxHp}</b></span></div>` +
      statusText(p) +
      `<div class="i-desc">${def.desc}</div>`;
  }

  function renderSkillbox() {
    const box = document.getElementById('skillbox');
    box.innerHTML = '';
    const st = API.state();
    if (st.phase !== 'action' || UIST.mode !== 'pieceSel' || UIST.selUid == null) return;
    const p = pieceByUid(st, UIST.selUid);
    if (!p || p.owner !== st.curPlayer || p.justDeployed || p.apLeft <= 0) return;

    // 大肉比蓄势按钮
    if (p.defId === 5 && p.charge <= 0) {
      box.innerHTML = '<button class="btn-move" data-act="brace">🐘 蓄势（下次移动才会真正挪动）</button>';
      return;
    }
    // 技能按钮
    const sk = API.rules.skillInfo(p);
    if (sk && sk.usable(p)) {
      box.innerHTML = `<button class="btn-skill" data-act="skill">${sk.label}</button>`;
    }
  }

  function refreshTop() {
    const st = API.state();
    const b0 = st.pieces.find((q) => !q.dead && q.defId === -1 && q.owner === 0);
    const b1 = st.pieces.find((q) => !q.dead && q.defId === -1 && q.owner === 1);
    if (!b0 || !b1) return; // 基地缺失（异常/特殊场景）时不动血条
    const f0 = Math.max(0, b0.hp) / BASE_HP * 100;
    const f1 = Math.max(0, b1.hp) / BASE_HP * 100;
    document.getElementById('hp-p1').style.width = f0 + '%';
    document.getElementById('hp-p2').style.width = f1 + '%';
    document.getElementById('hp-p1-text').textContent = `🏰 基地 ${Math.max(0, Math.round(b0.hp))}/${BASE_HP}`;
    document.getElementById('hp-p2-text').textContent = `${Math.max(0, Math.round(b1.hp))}/${BASE_HP} 基地 🏰`;
    document.getElementById('turn-num').textContent = `回合 ${st.turnCounter}`;
    document.getElementById('turn-owner').textContent =
      st.winner != null ? `🏆 ${PNAME[st.winner]}获胜` : `${PNAME[st.curPlayer]}行动中`;
    document.getElementById('side-p1').classList.toggle('active', st.curPlayer === 0 && st.winner == null);
    document.getElementById('side-p2').classList.toggle('active', st.curPlayer === 1 && st.winner == null);
  }

  function renderPhaseHint() {
    const st = API.state();
    const el = document.getElementById('phasehint');
    if (st.winner != null) { el.textContent = '🏆 战斗结束！点击「重开」再来一局。'; return; }
    if (UIST.choice && UIST.choice.spec && UIST.choice.spec.hint) {
      el.textContent = '👆 ' + UIST.choice.spec.hint;
      return;
    }
    if (st.phase === 'deploy') {
      el.textContent = '📜 部署阶段：处理手中的召唤卡（随从必须放置 / 法术可释放或储存）';
    } else {
      el.textContent = '⚔️ 行动阶段：点击己方棋子下达指令（移动 / 攻击 / 技能），或结束回合';
    }
  }

  function renderLog() {
    const st = API.state();
    const box = document.getElementById('log');
    const tail = st.log.slice(-70);
    box.innerHTML = tail.map((l) => `<div class="${l.cls}">${l.msg}</div>`).join('');
    box.scrollTop = box.scrollHeight;
  }

  function renderBtns() {
    const st = API.state();
    document.getElementById('btn-end').disabled = busy || st.phase !== 'action' || st.winner != null;
    document.getElementById('btn-undo').disabled = busy || !canUndo() || st.winner != null;
    document.getElementById('btn-restart').disabled = busy;
  }

  function renderPanel() {
    refreshTop();
    renderPhaseHint();
    renderHand();
    renderStored();
    renderInspect();
    renderSkillbox();
    renderBtns();
    renderLog();
  }

  function refreshAll() {
    renderCells();   // 先重建格子
    measure();       // 再测量真实格距（棋子定位依赖它）
    syncPieces();
    renderPanel();
  }

  return { measure, posOf, renderCells, syncPieces, movePieceTo, pieceEl,
           syncStatFlash: (uid) => {
             const p = pieceByUid(API.state(), uid);
             const el = pieceMap.get(uid);
             if (p && el) syncStatsOf(p, el);
           },
           refreshAll, renderPanel };
})();

/** 供 fx.js 调用的顶层便捷函数 */
function refreshTop() { UI.renderPanel(); }


/* ═══════════════ input.js · 交互状态机 ═══════════════
 * 核心节奏：act(fn) 加锁 → 执行逻辑 → 播放动画 → 解锁刷新。
 * ENV.choose 在这里落地为「高亮 + 等待点击」的 Promise。
 * ════════════════════════════════════════════════════ */

let busy = false;

/** 动作统一入口：加锁执行 → 播事件动画 → 解锁全刷 */
async function act(fn) {
  if (busy) return;
  busy = true;
  UI.renderPanel();
  try {
    await fn();
    await FX.playNew();
  } catch (err) {
    console.error(err);
    toast('操作出错啦：' + err.message, true);
  } finally {
    busy = false;
    UIST.mode = 'idle';
    UIST.cardIdx = null;
    UIST.selUid = null;
    UI.refreshAll();
  }
}

/* ─────────── 目标选择（ENV.choose 落地） ─────────── */

function ask(spec) {
  if (spec.kind === 'none') return Promise.resolve(null);
  return new Promise((resolve) => {
    UIST.choice = { spec, resolve };
    UI.refreshAll();
    if (spec.kind === 'option') mountOptionFloat(spec);
  });
}

function finishChoice(val) {
  const c = UIST.choice;
  UIST.choice = null;
  unmountOptionFloat();
  if (c) c.resolve(val);
  else UI.refreshAll();
}

function mountOptionFloat(spec) {
  unmountOptionFloat();
  const wrap = document.createElement('div');
  wrap.id = 'optfloat';
  const title = document.createElement('div');
  title.className = 'of-title';
  title.textContent = spec.hint || '请选择';
  wrap.appendChild(title);
  for (const opt of spec.options) {
    const b = document.createElement('button');
    b.className = 'of-btn';
    b.textContent = opt.label;
    b.onclick = () => finishChoice(opt.value);
    wrap.appendChild(b);
  }
  if (spec.cancelable) {
    const c = document.createElement('button');
    c.className = 'of-cancel';
    c.textContent = '取消';
    c.onclick = () => finishChoice(null);
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
}
function unmountOptionFloat() {
  const old = document.getElementById('optfloat');
  if (old) old.remove();
}

/* ─────────── 点击解析 ─────────── */

function tryResolveChoiceByCell(x, y) {
  const spec = UIST.choice && UIST.choice.spec;
  if (!spec) return false;
  if (spec.kind === 'cell' && spec.cells.some((c) => c.x === x && c.y === y)) {
    finishChoice({ x, y });
    return true;
  }
  if (spec.kind === 'piece') {
    const occ = pieceAt(API.state(), x, y);
    if (occ && spec.pieces.includes(occ)) { finishChoice(occ); return true; }
  }
  return true; // 选择模式下吞掉其它点击
}

function tryResolveChoiceByPiece(p) {
  const spec = UIST.choice && UIST.choice.spec;
  if (!spec) return false;
  if (spec.kind === 'piece' && spec.pieces.includes(p)) { finishChoice(p); return true; }
  return true;
}

/** 格子被点击。
 *  注意：目标选择（choice）期间 busy 也是 true——此时必须放行，
 *  否则 choose 的 Promise 永远等不到点击，会造成死锁。 */
function onCellClick(x, y) {
  if (UIST.choice) { tryResolveChoiceByCell(x, y); return; }
  if (busy) return;
  const st = API.state();

  // 部署阶段
  if (st.phase === 'deploy' && UIST.mode === 'deployCard' && UIST.cardIdx != null) {
    const idx = UIST.cardIdx;
    act(() => API.deployFollower(idx, x, y));
    return;
  }

  // 行动阶段：对已选棋子下达指令
  if (st.phase === 'action' && UIST.mode === 'pieceSel' && UIST.selUid != null) {
    const key = x + ',' + y;
    const p = pieceByUid(st, UIST.selUid);
    if (!p) return;
    const mv = API.rules.moveTargets(p).some((c) => c.x === x && c.y === y);
    if (mv && !(p.defId === 5 && p.charge <= 0)) {
      act(() => API.doMove(UIST.selUid, x, y));
      return;
    }
    const occ = pieceAt(st, x, y);
    if (occ && occ !== p) {
      const isAtk = API.rules.attackTargets(p).includes(occ);
      const isHeal = p.defId === 2 && occ.owner === p.owner &&
                     API.rules.healTargets(p).includes(occ);
      if (isAtk || isHeal) {
        act(() => API.doAttack(UIST.selUid, occ.uid));
        return;
      }
    }
  }
}

/** 棋子被点击 */
function onPieceClick(p) {
  if (UIST.choice) { tryResolveChoiceByPiece(p); return; }
  if (busy) return;
  const st = API.state();
  UIST.inspectUid = p.uid;

  if (st.winner != null) { UI.renderPanel(); return; }

  // ── 已选中己方棋子时：点敌方红框棋子＝发起攻击；点残血友方绿框棋子＝治疗。
  //    （必须在此解析：敌方棋子 DOM 盖在格子上，点它不会经过 onCellClick）
  if (st.phase === 'action' && UIST.mode === 'pieceSel' && UIST.selUid != null &&
      UIST.selUid !== p.uid) {
    const sel = pieceByUid(st, UIST.selUid);
    if (sel && sel.owner === st.curPlayer && !sel.justDeployed && sel.apLeft > 0) {
      const isAtk = p.owner !== st.curPlayer && API.rules.attackTargets(sel).includes(p);
      const isHeal = sel.defId === 2 && p.owner === sel.owner &&
                     API.rules.healTargets(sel).includes(p);
      if (isAtk || isHeal) {
        const uid = sel.uid;
        act(() => API.doAttack(uid, p.uid));
        return;
      }
    }
  }

  if (p.owner === st.curPlayer && st.phase === 'action') {
    if (p.justDeployed) {
      toast('💤 刚部署的棋子本回合还在热身，下回合才能行动（冲锋怪可以选择冲锋立即行动哦）');
    } else if (p.apLeft <= 0) {
      toast('⚡ 这枚棋子本回合的行动点已经用完了');
    }
  }

  // 点自己的可行动棋子 → 进入指挥模式
  if (p.owner === st.curPlayer &&
      ((st.phase === 'action' && !p.justDeployed && p.apLeft > 0) ||
       st.phase === 'deploy')) {
    UIST.mode = 'pieceSel';
    UIST.selUid = p.uid;
  } else if (UIST.mode === 'pieceSel' && UIST.selUid !== p.uid) {
    UIST.mode = 'idle';
    UIST.selUid = null;
  }
  UI.refreshAll();
}

/* ─────────── DOM 事件绑定 ─────────── */

function bindEvents() {
  // 棋盘：棋子挂在 #board-outer 上（避免被格子层重建清除），
  // 因此监听器必须绑在外层容器才能同时接住棋子与格子的点击
  document.getElementById('board-outer').addEventListener('click', (e) => {
    const pel = e.target.closest('.piece');
    if (pel) {
      const p = pieceByUid(API.state(), Number(pel.dataset.uid));
      if (p) { onPieceClick(p); return; }
    }
    const cel = e.target.closest('.cell');
    if (cel) onCellClick(Number(cel.dataset.x), Number(cel.dataset.y));
  });

  // 手牌 / 储存栏（事件委托）
  document.getElementById('hand').addEventListener('click', (e) => {
    const btn = e.target;
    const st = API.state();
    if (btn.dataset.cast != null) {
      const idx = Number(btn.dataset.cast);
      runSpellCast(() => getHandSpec(idx), (got) => API.castHandSpell(idx, got));
      return;
    }
    if (btn.dataset.store != null) {
      act(() => API.storeHandSpell(Number(btn.dataset.store)));
      return;
    }
    if (btn.dataset.discard != null) {
      act(() => API.discardUnplaceable(Number(btn.dataset.discard)));
      return;
    }
    // 卡片本体：随从卡切换部署模式
    const cardEl = btn.closest('.card');
    if (!cardEl || !cardEl.dataset.idx) return;
    const idx = Number(cardEl.dataset.idx);
    const card = st.hand[st.curPlayer][idx];
    if (!card || getDef(card.defId).type === 'spell') return;
    if (UIST.mode === 'deployCard' && UIST.cardIdx === idx) {
      UIST.mode = 'idle'; UIST.cardIdx = null;
    } else {
      UIST.mode = 'deployCard'; UIST.cardIdx = idx;
    }
    UI.refreshAll();
  });

  document.getElementById('stored').addEventListener('click', (e) => {
    if (e.target.dataset.castStored != null) {
      const idx = Number(e.target.dataset.castStored);
      runSpellCast(() => {
        const card = API.state().stored[API.state().curPlayer][idx];
        return SPELL_TARGETS[card.defId](API.state(), API.state().curPlayer);
      }, (got) => API.castStored(idx, got));
    }
  });

  // 技能框
  document.getElementById('skillbox').addEventListener('click', (e) => {
    if (e.target.dataset.act === 'brace') {
      const p = pieceByUid(API.state(), UIST.selUid);
      if (p) act(() => API.doMove(p.uid, p.x, p.y)); // 大肉比蓄势
    } else if (e.target.dataset.act === 'skill') {
      const uid = UIST.selUid;
      act(() => API.useSkill(uid));
    }
  });
}

/** 法术通用流程：先选目标，再执行 */
async function runSpellCast(getSpec, run) {
  if (busy) return;
  busy = true;
  try {
    const spec = getSpec();
    const got = await ask(spec);
    if (got == null) { busy = false; UI.refreshAll(); return; }
    await run(got);
    await FX.playNew();
  } catch (err) {
    console.error(err);
    toast('施法失败：' + err.message, true);
  } finally {
    busy = false;
    UIST.choice = null;
    unmountOptionFloat();
    UIST.mode = 'idle'; UIST.cardIdx = null; UIST.selUid = null;
    UI.refreshAll();
  }
}

function getHandSpec(idx) {
  const st = API.state();
  const card = st.hand[st.curPlayer][idx];
  return SPELL_TARGETS[card.defId](st, st.curPlayer);
}

// 注入逻辑层的选择器
ENV.choose = ask;

/* ─────────── 启动 ─────────── */

async function boot() {
  bindTopButtons();
  bindEvents();   // 棋盘 / 手牌 / 储存栏 / 技能框的点击委托
  await API.init((Math.random() * 0xffffffff) >>> 0);
  UI.refreshAll();

  // 调试/自动化测试钩子（不影响正常游玩）
  if (typeof window !== 'undefined') {
    window.__HJ_DEBUG__ = { api: API, ui: UI, uist: UIST };
  }

  // 首次进入自动展示一次规则提示
  toast('欢迎来到「浩劫」！首次游玩建议先读一读 📐 规则 哦～');
}

function bindTopButtons() {
  document.getElementById('btn-end').onclick = () => act(() => API.endTurn());
  document.getElementById('btn-undo').onclick = async () => {
    if (busy) return;
    if (await API.undo()) { UI.refreshAll(); toast('↩ 已撤销上一步'); }
  };
  document.getElementById('btn-codex').onclick = () => openModal('codex');
  document.getElementById('btn-rules').onclick = () => openModal('rules');
  document.getElementById('btn-restart').onclick = () => {
    if (confirm('确定要重新开始吗？当前对局将丢失。')) location.reload();
  };

  // 模态框
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });
  document.querySelectorAll('.mtab').forEach((b) => {
    b.onclick = () => switchTab(b.dataset.tab);
  });

  // 快捷键：Esc 取消选择/关闭弹窗；U 悔棋；E 结束回合
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!document.getElementById('modal').classList.contains('hidden')) closeModal();
      else if (UIST.choice && UIST.choice.spec.cancelable) finishChoice(null);
      else if (UIST.mode !== 'idle') {
        UIST.mode = 'idle'; UIST.cardIdx = null; UIST.selUid = null;
        UI.refreshAll();
      }
    } else if (e.key === 'u' || e.key === 'U') {
      document.getElementById('btn-undo').click();
    } else if (e.key === 'e' || e.key === 'E') {
      document.getElementById('btn-end').click();
    }
  });

  // 右键：取消目标选择
  document.addEventListener('contextmenu', (e) => {
    if (UIST.choice) {
      e.preventDefault();
      if (UIST.choice.spec.cancelable) finishChoice(null);
      return;
    }
    if (UIST.mode !== 'idle') {
      e.preventDefault();
      UIST.mode = 'idle'; UIST.cardIdx = null; UIST.selUid = null;
      UI.refreshAll();
    }
  });

  // 窗口尺寸变化后重排棋子
  window.addEventListener('resize', () => {
    UI.refreshAll();
  });
}

boot();

})();

</script>
