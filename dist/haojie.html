<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浩劫 · 双人对战棋</title>
<style>
/* ═══════════════════════════════════════════════════════════
   浩劫 · 样式表
   暗色魔幻风；蓝方(P1)=青蓝，红方(P2)=玫红。
   ═══════════════════════════════════════════════════════════ */

:root {
  /* 主题 token（本作为深色设计，直接固定深色调） */
  --bg-0: #0b0e17;
  --bg-1: #111527;
  --bg-2: #1a2038;
  --bg-3: #232b4a;
  --ink: #e8ecf8;
  --ink-dim: #9aa3c0;
  --ink-faint: #5d6580;
  --p1: #38bdf8;          /* 蓝方主色 */
  --p1-deep: #0c4a6e;
  --p2: #fb7185;          /* 红方主色 */
  --p2-deep: #881337;
  --gold: #fbbf24;
  --green: #34d399;
  --purple: #c084fc;
  --danger: #f87171;
  --line: rgba(148, 163, 216, .16);
  --cell: min(6.1vh, 6.4vw, 60px);
  --radius: 10px;
  font-size: 15px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }
body {
  background:
    radial-gradient(1100px 700px at 78% -10%, #1d2547 0%, transparent 55%),
    radial-gradient(900px 600px at 12% 108%, #26152f 0%, transparent 55%),
    var(--bg-0);
  color: var(--ink);
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
}

#app { height: 100vh; display: flex; flex-direction: column; }

/* ─────────── 顶栏 ─────────── */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px;
  background: linear-gradient(180deg, rgba(20,26,48,.92), rgba(14,18,34,.85));
  border-bottom: 1px solid var(--line);
  box-shadow: 0 4px 22px rgba(0,0,0,.45);
  z-index: 30;
}
.side { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.side-p2 { justify-content: flex-end; }
.side-name { font-weight: 700; white-space: nowrap; letter-spacing: .5px; }
.side-p1 .side-name { color: var(--p1); text-shadow: 0 0 14px rgba(56,189,248,.5); }
.side-p2 .side-name { color: var(--p2); text-shadow: 0 0 14px rgba(251,113,133,.5); }

.basebar {
  position: relative; flex: 1; max-width: 340px; height: 22px;
  background: #0d1120; border: 1px solid var(--line); border-radius: 999px;
  overflow: hidden;
}
.basebar-fill {
  position: absolute; inset: 0; width: 100%;
  border-radius: 999px;
  transition: width .5s cubic-bezier(.22,1,.36,1), background .4s;
}
.side-p1 .basebar-fill {
  background: linear-gradient(90deg, #155e75, var(--p1));
  box-shadow: 0 0 16px rgba(56,189,248,.45) inset;
}
.side-p2 .basebar-fill {
  right: 0; left: auto;
  background: linear-gradient(270deg, #9f1239, var(--p2));
  box-shadow: 0 0 16px rgba(251,113,133,.45) inset;
}
.basebar-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: .78rem; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  letter-spacing: 1px;
}
.side.active .side-name::after { content: " ◈"; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .35; } }

#turnbox { text-align: center; min-width: 130px; }
#turn-num { font-size: 1.02rem; font-weight: 900; letter-spacing: 2px; color: var(--gold); }
#turn-owner { font-size: .82rem; color: var(--ink-dim); margin-top: 1px; }

/* ─────────── 主布局 ─────────── */
#layout {
  flex: 1; display: flex; gap: 14px;
  padding: 10px 16px 14px;
  min-height: 0;
}
#boardwrap { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
#board-outer { position: relative; }

/* ─────────── 棋盘 ─────────── */
#board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(9, var(--cell));
  grid-template-rows: repeat(13, var(--cell));
  gap: 3px;
  padding: 10px;
  background: linear-gradient(160deg, rgba(30,38,70,.72), rgba(16,20,40,.85));
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 0 60px rgba(64,84,160,.08);
}

.cell {
  position: relative;
  border-radius: 7px;
  background: rgba(120,140,220,.07);
  border: 1px solid rgba(148,163,216,.09);
  transition: background .18s, box-shadow .18s, border-color .18s;
}
.cell:hover { background: rgba(140,160,240,.14); }

/* 基地格 */
.cell.base-cell { border-width: 2px; }
.cell.base-cell.p1 { border-color: var(--p1); background: radial-gradient(circle, rgba(56,189,248,.28), rgba(56,189,248,.06)); }
.cell.base-cell.p2 { border-color: var(--p2); background: radial-gradient(circle, rgba(251,113,133,.28), rgba(251,113,133,.06)); }
.cell.base-cell.p1.deploy-glow { background: radial-gradient(circle, rgba(56,189,248,.5), rgba(56,189,248,.12)); }
.cell.base-cell.p2.deploy-glow { background: radial-gradient(circle, rgba(251,113,133,.5), rgba(251,113,133,.12)); }
.base-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .5); filter: drop-shadow(0 0 6px currentColor); }

/* 部署高亮 */
.cell.dep-ok {
  cursor: pointer;
  background: rgba(94, 234, 152, .13);
  border-color: rgba(94, 234, 152, .55);
  animation: depPulse 1.6s ease-in-out infinite;
}
.cell.dep-ok:hover { background: rgba(94, 234, 152, .3); }
@keyframes depPulse { 50% { box-shadow: 0 0 12px rgba(94,234,152,.35); } }

/* 移动 / 攻击 / 技能目标高亮 */
.cell.mv-ok {
  cursor: pointer;
  background: rgba(96, 165, 250, .18);
  border-color: rgba(96, 165, 250, .65);
  box-shadow: inset 0 0 14px rgba(96,165,250,.25);
}
.cell.mv-ok:hover { background: rgba(96, 165, 250, .36); }
.cell.atk-ok { cursor: crosshair; border-color: rgba(248, 113, 113, .85); animation: atkPulse 1s ease-in-out infinite; }
@keyframes atkPulse { 50% { box-shadow: 0 0 16px rgba(248,113,113,.55), inset 0 0 10px rgba(248,113,113,.3); } }
.cell.sk-ok { cursor: pointer; border-color: rgba(192, 132, 252, .9); background: rgba(192, 132, 252, .16); animation: skPulse 1.1s ease-in-out infinite; }
.cell.sk-ok:hover { background: rgba(192, 132, 252, .34); }
@keyframes skPulse { 50% { box-shadow: 0 0 14px rgba(192,132,252,.5); } }
.cell.heal-ok { cursor: pointer; border-color: rgba(52, 211, 153, .85); background: rgba(52, 211, 153, .14); animation: healPulse 1.2s ease-in-out infinite; }
@keyframes healPulse { 50% { box-shadow: 0 0 12px rgba(52,211,153,.45); } }
.cell.sel-hl { border-color: var(--gold); box-shadow: 0 0 14px rgba(251,191,36,.5); }

/* 攻击路径阻挡提示 */
.cell.blocked-dot::after {
  content: ""; position: absolute; inset: 42%;
  border-radius: 50%; background: rgba(248,113,113,.4);
}

/* ─────────── 棋子 ─────────── */
.piece {
  position: absolute;
  left: 0; top: 0;
  width: calc(var(--cell) - 6px); height: calc(var(--cell) - 6px);
  margin: 3px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--cell) * .46);
  z-index: 5;
  cursor: pointer;
  transition: left .32s cubic-bezier(.34,1.3,.5,1), top .32s cubic-bezier(.34,1.3,.5,1),
              transform .18s, opacity .3s, filter .3s;
  will-change: left, top;
}
.piece .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.piece.own0 .face {
  background: radial-gradient(circle at 32% 28%, #7dd3fc, #0ea5e9 58%, #0c4a6e);
  box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 14px rgba(56,189,248,.4), inset 0 -3px 8px rgba(0,0,0,.35);
  border: 2px solid #bae6fd;
}
.piece.own1 .face {
  background: radial-gradient(circle at 32% 28%, #fda4af, #f43f5e 58%, #881337);
  box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 0 14px rgba(251,113,133,.4), inset 0 -3px 8px rgba(0,0,0,.35);
  border: 2px solid #fecdd3;
}
.piece.neutral .face {
  background: radial-gradient(circle at 32% 28%, #d4d4d8, #71717a 60%, #27272a);
  border: 2px solid #e4e4e7; box-shadow: 0 3px 8px rgba(0,0,0,.5);
}

/* 数值角标 */
.piece .stat {
  position: absolute; z-index: 2;
  font-size: calc(var(--cell) * .21); font-weight: 900; line-height: 1;
  padding: 2px 4px; border-radius: 6px;
  background: rgba(8,10,20,.82); border: 1px solid rgba(255,255,255,.18);
  text-shadow: 0 1px 2px #000;
}
.piece .stat.atk { left: -4px; bottom: -3px; color: #fca5a5; }
.piece .stat.hp  { right: -4px; bottom: -3px; color: #86efac; }
.piece.hurt .stat.hp { color: var(--danger); }

/* 状态徽标（右上小图标） */
.piece .badges {
  position: absolute; top: -8px; right: -8px; z-index: 3;
  display: flex; gap: 1px; font-size: calc(var(--cell) * .2);
  text-shadow: 0 0 4px #000;
}
/* 行动点 */
.piece .apdots {
  position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); z-index: 3;
  display: flex; gap: 2px;
}
.apdot { width: calc(var(--cell) * .11); height: calc(var(--cell) * .11); border-radius: 50%; background: var(--gold); box-shadow: 0 0 5px rgba(251,191,36,.8); }
.apdot.spent { background: #3b4256; box-shadow: none; }

/* 状态外观 */
.piece.exhausted { filter: grayscale(.75) brightness(.62); }
.piece.shielded .face { box-shadow: 0 0 0 3px rgba(103,232,249,.8), 0 0 22px rgba(103,232,249,.7) !important; animation: shieldSpin 2.4s linear infinite; }
@keyframes shieldSpin { 50% { filter: brightness(1.35); } }
.piece.marked::after {
  content: "🎯"; position: absolute; top: -10px; left: -8px; font-size: calc(var(--cell)*.24);
  animation: wobble 1s ease-in-out infinite;
}
@keyframes wobble { 50% { transform: rotate(-14deg); } }
.piece.charged .face { box-shadow: 0 0 18px rgba(251,191,36,.75), 0 3px 10px rgba(0,0,0,.5) !important; }
.piece.reapered::before {
  content: "💀"; position: absolute; top: -10px; left: -8px; font-size: calc(var(--cell)*.24); z-index: 4;
}
.piece.charmed::before {
  content: "🎭"; position: absolute; top: -10px; left: -8px; font-size: calc(var(--cell)*.24); z-index: 4;
  animation: wobble 1.4s ease-in-out infinite;
}
.piece.buffed .stat.atk { color: var(--gold); text-shadow: 0 0 6px rgba(251,191,36,.9); }
.piece.big5 { width: calc(var(--cell) * 2 - 6px); height: calc(var(--cell) * 2 - 6px); border-radius: 18%; }
.piece.big5 .face { border-radius: 18%; font-size: calc(var(--cell) * .8); }
.piece.selected { transform: scale(1.12); z-index: 8; }
.piece.selected .face { box-shadow: 0 0 0 3px var(--gold), 0 0 20px rgba(251,191,36,.6) !important; }

/* 入场 / 死亡动画 */
.piece.pop-in { animation: popIn .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { 0% { transform: scale(.15) translateY(-14px); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.piece.dying { animation: dieAnim .5s ease-in forwards; pointer-events: none; z-index: 20; }
@keyframes dieAnim {
  0% { transform: scale(1); filter: brightness(2); }
  100% { transform: scale(.2) rotate(80deg); opacity: 0; filter: brightness(3) blur(2px); }
}
.piece.hit-jolt { animation: jolt .3s; }
@keyframes jolt {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(-4px,2px) scale(.95); }
  55% { transform: translate(4px,-2px) scale(.97); }
}

/* ─────────── 特效层 ─────────── */
#fxlayer { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: visible; }

.fly-num {
  position: absolute; z-index: 50; font-weight: 900; font-size: calc(var(--cell) * .34);
  transform: translate(-50%, -50%);
  animation: floatUp 1s cubic-bezier(.2,.7,.4,1) forwards;
  text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 10px currentColor;
  white-space: nowrap;
}
.fly-num.dmg { color: #ff6b6b; }
.fly-num.crit { color: #ffb703; font-size: calc(var(--cell) * .46); }
.fly-num.heal { color: #4ade80; }
.fly-num.buff { color: var(--purple); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); }
  18% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
}

.slash {
  position: absolute; z-index: 49; height: 4px; border-radius: 4px;
  background: linear-gradient(90deg, transparent, #fff 30%, var(--danger) 55%, transparent);
  transform-origin: left center;
  animation: slashGo .26s ease-out forwards;
  filter: drop-shadow(0 0 8px rgba(255,80,80,.9));
}
@keyframes slashGo { 0% { transform: scaleX(0) rotate(var(--rot)); } 100% { transform: scaleX(1) rotate(var(--rot)); opacity: .1; } }

.bolt {
  position: absolute; z-index: 48; width: 14px; height: 14px; border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 14px 4px currentColor;
  background: radial-gradient(circle, #fff 20%, currentColor 60%);
}
.ring {
  position: absolute; z-index: 47; border-radius: 50%;
  border: 3px solid currentColor;
  transform: translate(-50%, -50%);
  animation: ringGrow .55s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes ringGrow { 0% { width: 8px; height: 8px; opacity: 1; } 100% { width: calc(var(--ring-w)); height: calc(var(--ring-w)); opacity: 0; } }

.boom {
  position: absolute; z-index: 46; width: 12px; height: 12px; border-radius: 3px;
  transform: translate(-50%, -50%) rotate(45deg);
  animation: boomFly .7s cubic-bezier(.15,.6,.4,1) forwards;
}
@keyframes boomFly {
  0% { opacity: 1; transform: translate(-50%,-50%) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(300deg) scale(.3); }
}

.spell-cast {
  position: absolute; z-index: 51; font-size: calc(var(--cell) * .8);
  transform: translate(-50%, -50%);
  animation: spellPop .8s cubic-bezier(.2,.9,.3,1.2) forwards;
  filter: drop-shadow(0 0 12px rgba(192,132,252,.9));
}
@keyframes spellPop {
  0% { transform: translate(-50%,-50%) scale(.2) rotate(-30deg); opacity: 0; }
  35% { transform: translate(-50%,-50%) scale(1.3) rotate(6deg); opacity: 1; }
  100% { transform: translate(-50%,-90%) scale(1); opacity: 0; }
}

body.shake #board-outer { animation: shakeIt .38s; }
@keyframes shakeIt {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-7px,4px); }
  45% { transform: translate(6px,-5px); }
  70% { transform: translate(-4px,2px); }
}

/* 回合横幅 */
#banner {
  position: absolute; left: 50%; top: 44%;
  transform: translateX(-50%);
  padding: 14px 46px;
  font-size: 1.5rem; font-weight: 900; letter-spacing: 6px; white-space: nowrap;
  background: linear-gradient(90deg, transparent, rgba(10,14,28,.92) 18% 82%, transparent);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  z-index: 60;
  animation: bannerSweep 1.15s cubic-bezier(.25,.8,.3,1) forwards;
}
#banner.b1 { color: var(--p1); text-shadow: 0 0 22px rgba(56,189,248,.9); }
#banner.b2 { color: var(--p2); text-shadow: 0 0 22px rgba(251,113,133,.9); }
#banner.bwin { color: var(--gold); text-shadow: 0 0 26px rgba(251,191,36,1); }
#banner.hidden { display: none; }
@keyframes bannerSweep {
  0% { opacity: 0; transform: translateX(-50%) scaleX(.2); }
  18% { opacity: 1; transform: translateX(-50%) scaleX(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) scaleX(1.05); }
}

/* ─────────── 右侧面板 ─────────── */
#panel {
  flex: 1; min-width: 320px; max-width: 480px;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 0;
  overflow-y: auto;
  padding-right: 4px;
}
#panel::-webkit-scrollbar { width: 7px; }
#panel::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }

.panel-block {
  background: rgba(22,28,52,.66);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 10px;
}
.block-title { font-size: .82rem; font-weight: 700; color: var(--ink-dim); margin-bottom: 6px; letter-spacing: 1px; }
.block-sub { font-weight: 400; font-size: .72rem; color: var(--ink-faint); }
.empty-hint { color: var(--ink-faint); font-size: .8rem; padding: 4px 2px; }

#phasehint {
  padding: 7px 12px; border-radius: var(--radius);
  background: linear-gradient(90deg, rgba(251,191,36,.14), transparent 70%);
  border-left: 3px solid var(--gold);
  font-size: .86rem; font-weight: 600;
}

.cardrow { display: flex; gap: 8px; flex-wrap: wrap; min-height: 30px; }

.card {
  position: relative; width: 128px;
  background: linear-gradient(165deg, #232c50, #161c34);
  border: 1px solid rgba(148,163,216,.3);
  border-radius: 10px; padding: 7px 8px 8px;
  cursor: pointer;
  transition: transform .16s, box-shadow .16s, border-color .16s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.45); border-color: var(--gold); }
.card.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(251,191,36,.5), 0 8px 18px rgba(0,0,0,.4); animation: cardBreath 1.4s ease-in-out infinite; }
/* 部署阶段待处理的手牌：轻微呼吸，提示“先点我” */
.card.awaiting { animation: cardBreath 1.6s ease-in-out infinite; }
@keyframes cardBreath {
  0%, 100% { box-shadow: 0 0 6px rgba(251,191,36,.25), 0 8px 18px rgba(0,0,0,.35); }
  50% { box-shadow: 0 0 20px rgba(251,191,36,.75), 0 8px 18px rgba(0,0,0,.35); }
}
.card.spell-card { background: linear-gradient(165deg, #33254e, #1c1530); border-color: rgba(192,132,252,.4); }
.card.disabled { opacity: .45; pointer-events: none; }
.card .c-head { display: flex; align-items: center; gap: 6px; }
.card .c-emoji { font-size: 1.25rem; filter: drop-shadow(0 0 5px rgba(255,255,255,.25)); }
.card .c-name { font-weight: 800; font-size: .86rem; }
.card .c-stats { display: flex; gap: 7px; margin: 4px 0 3px; font-size: .68rem; color: var(--ink-dim); font-weight: 700; }
.card .c-desc { font-size: .68rem; color: var(--ink-dim); line-height: 1.45; max-height: 62px; overflow-y: auto; }
.card .c-limit { position: absolute; top: -7px; right: -6px; font-size: .64rem; background: var(--purple); color: #180b2a; font-weight: 900; border-radius: 8px; padding: 1px 6px; }
.card .card-btns { display: flex; gap: 5px; margin-top: 6px; }
.mini-btn {
  flex: 1; padding: 3px 0; font-size: .7rem; font-weight: 700;
  border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg-3); color: var(--ink); cursor: pointer;
  transition: filter .15s;
}
.mini-btn:hover { filter: brightness(1.3); }
.mini-btn.gold { background: linear-gradient(90deg, #92400e, #b45309); border-color: var(--gold); }
.mini-btn.purple { background: linear-gradient(90deg, #5b21b6, #7c3aed); border-color: var(--purple); }

/* 详情面板 */
#inspect { font-size: .8rem; min-height: 40px; }
#inspect .i-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
#inspect .i-emoji { font-size: 1.5rem; }
#inspect .i-name { font-weight: 800; font-size: .95rem; }
#inspect .i-owner { font-size: .72rem; padding: 1px 7px; border-radius: 8px; font-weight: 700; }
#inspect .i-owner.o0 { background: rgba(56,189,248,.18); color: var(--p1); }
#inspect .i-owner.o1 { background: rgba(251,113,133,.18); color: var(--p2); }
#inspect .i-stats { display: flex; gap: 10px; margin: 5px 0; font-weight: 700; font-size: .74rem; color: var(--ink-dim); flex-wrap: wrap; }
#inspect .i-stats b { color: var(--ink); }
#inspect .i-desc { color: var(--ink-dim); line-height: 1.55; font-size: .74rem; }

#skillbox { display: flex; gap: 7px; flex-wrap: wrap; }
.btn-skill {
  padding: 7px 13px; border-radius: 9px; font-weight: 800; font-size: .8rem;
  border: 1px solid var(--purple); cursor: pointer;
  background: linear-gradient(160deg, #6d28d9, #4c1d95); color: #ede9fe;
  box-shadow: 0 3px 10px rgba(109,40,217,.4);
  transition: transform .14s, filter .14s;
}
.btn-skill:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.2); }
.btn-skill:disabled { opacity: .4; cursor: not-allowed; }
.btn-move, .btn-atk {
  padding: 7px 13px; border-radius: 9px; font-weight: 800; font-size: .8rem; cursor: pointer;
  border: 1px solid var(--line); transition: transform .14s, filter .14s;
}

/** 推进并返回一个 [0,1) 随机数；state.seed 被原地更新。 */
function rnd(state) {
  let t = (state.seed = (state.seed + 0x6d2b79f5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/** [lo, hi] 整数随机。 */
function rndInt(state, lo, hi) {
  return lo + Math.floor(rnd(state) * (hi - lo + 1));

/** 从数组均匀取一个元素。 */

function getDef(defId) {
  if (defId === -1) return DEF_BASE;
  if (defId === -2) return DEF_GRAVE;
  if (defId === -3) return DEF_BARRIER;
  if (defId === 33) return DEF_BLADE;
  return DEFS.find((d) => d.id === defId);
}


/* ═══════════════ state.js · 游戏状态 / 快照悔棋 / 事件流 ═══════════════
 * 逻辑层不触碰 DOM：
 *   - 状态 S 是纯数据，可 JSON 序列化（悔棋 = 快照栈）
 *   - 动画通过事件队列 EV 传递给表现层
 *   - 需要玩家选择时通过 ENV.choose 异步注入（UI 或测试环境提供）
 * ═════════════════════════════════════════════════════════════════════ */

/** 表现层注入点：choose(spec) → Promise<target>；spec 形如
 *  {kind:'cell', cells:[{x,y}], kind2:'piece'|'cell'|'option', ...} */
const ENV = { choose: null };

/** 当前对局 */
let S = null;

/** 事件队列：逻辑层同步写入，UI 层在操作完成后异步播放。不入快照。 */
const EV = [];
function ev(type, data) { EV.push(Object.assign({ type }, data)); }

/** 悔棋快照栈（存序列化字符串，避免引用泄漏） */
const UNDO_MAX = 600;
let undoStack = [];

function pushLog(state, msg, cls) {
  state.log.push({ msg, cls: cls || '' });
  if (state.log.length > 300) state.log.shift();
}

/** 创建棋子（纯数据） */
function makePiece(state, owner, defId, x, y, hpOver) {
  const def = getDef(defId);
  const p = {
    uid: ++state.uidSeq,
    owner,
    defId,
    x, y,
    hp: hpOver != null ? hpOver : def.hp,
    maxHp: def.hp,
    atk: def.atk,
    range: def.rng,
    mv: def.mv,
    big: !!def.big || defId === 5,
    justDeployed: true,
    apLeft: 0,
    charge: 0,
    skillUses: 0,
    killCount: 0,
    guardUsed: false,
    mark10: null,
    shieldUntil: 0,
    reaperFrom: 0, reaperTo: 0,
    charmFrom: 0, charmTo: 0,
    atkBuffs: [],
    beatCount: 0,
    diesAt: 0,
    hitThisTurn: [],
  };
  return p;
}

/** 开新局。先手随机。 */
function newGame(seed) {
  undoStack = [];
  EV.length = 0;
  const st = {
    seed: seed >>> 0 || 1234567,
    turnCounter: 0,
    curPlayer: -1,
    phase: 'deploy',
    winner: null,
    pieces: [],
    hand: [[], []],
    stored: [[], []],
    extraDraw: [0, 0],
    extraRows: [[], []],
    uidSeq: 1000,
    log: [],
  };
  // 双方基地
  st.pieces.push(makePiece(st, 0, -1, 5, 1));
  st.pieces.push(makePiece(st, 1, -1, 5, H));
  S = st;
  pushLog(st, '⚔️ 「浩劫」开局！先手由天命决定……');
  return st;
}

/* ─────────── 悔棋 ─────────── */

/** 在一次玩家操作前调用：压入当前完整状态快照。 */
function snap() {
  undoStack.push(JSON.stringify(S));
  if (undoStack.length > UNDO_MAX) undoStack.shift();
}

/** 撤销最近一次操作；无可撤时返回 false。 */
function undo() {
  if (!undoStack.length) return false;
  S = JSON.parse(undoStack.pop());
  EV.length = 0; // 丢弃半途事件，直接整体重绘
  return true;
}

function canUndo() { return undoStack.length > 0 && !S.winner; }

/* ─────────── 常用查询 ─────────── */

function pieceAt(state, x, y) {
  for (const p of state.pieces) {
    if (p.dead) continue;
    if (p.big) {
      if (x >= p.x && x <= p.x + 1 && y >= p.y && y <= p.y + 1) return p;
    } else if (p.x === x && p.y === y) return p;
  }
  return null;
}

function pieceByUid(state, uid) {
  return state.pieces.find((p) => p.uid === uid && !p.dead) || null;
}

/** 有效攻击力（刀魂按周围人数实时计算，含临时增益） */
function effAtk(p) {
  const now = S.turnCounter;
  let a = p.defId === 33 ? bladeN(p) * 40 : p.atk;
  for (const b of p.atkBuffs) if (now < b.until) a += b.amt;
  return a;
}

const PNAME = ['蓝方', '红方'];


/* ═══════════════ rules.js · 几何与合法性判定 ═══════════════
 * 所有“格数”均为曼哈顿距离 |Δx| + |Δy|。
 * 攻击穿透规则：若到目标所有 ≤射程 的路径都被其他敌方棋子
 * 封死，则无法攻击（BFS 判可达）。
 * ═══════════════════════════════════════════════════════════ */

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function inBoard(x, y) { return x >= 1 && x <= W && y >= 1 && y <= H; }
function mdist(ax, ay, bx, by) { return Math.abs(ax - bx) + Math.abs(ay - by); }

/** 棋子占据的全部格子 */
function pieceCells(p) {
  if (!p.big) return [{ x: p.x, y: p.y }];
  const c = [];
  for (const dx of [0, 1]) for (const dy of [0, 1]) c.push({ x: p.x + dx, y: p.y + dy });
  return c;
}

/** 两棋子间的最近格距（按各自占据格两两求最小） */
function nearestDist(a, b) {
  let best = Infinity;
  for (const ca of pieceCells(a)) for (const cb of pieceCells(b)) {
    const d = mdist(ca.x, ca.y, cb.x, cb.y);
    if (d < best) best = d;
  }
  return best;
}

/** 刀魂（33 号）的 n：以其为中心 3×3 内随从数量（双方、含自身、实时计算） */
function bladeN(p) {
  let n = 0;
  for (const q of S.pieces) {
    if (q.dead) continue;
    const t = getDef(q.defId).type;
    if (t !== 'follower' && t !== 'grave') continue;
    for (const c of pieceCells(q)) {
      if (Math.abs(c.x - p.x) <= 1 && Math.abs(c.y - p.y) <= 1) { n++; break; }
    }
  }
  return Math.max(1, n);
}

/** 有效射程（刀魂动态，其余为静态值；定炮蓄满 +1 在攻击目标计算中另行叠加） */
function effRange(p) {
  return p.defId === 33 ? bladeN(p) : p.range;
}

/** 是否为 23 号独行侠的禁入邻圈（对 owner 阵营而言） */
function inLonerZone(x, y, owner) {
  for (const q of S.pieces) {
    if (q.dead || q.defId !== 23 || q.owner !== owner) continue;
    if (mdist(x, y, q.x, q.y) <= 1) return true;
  }
  return false;
}

/** 通用可达空格 BFS（≤maxStep 步，途经不可穿子，独行侠禁入圈对友方生效），含起点 */
function bfsEmptyCells(state, p, maxStep) {
  const out = [{ x: p.x, y: p.y }];
  if (maxStep <= 0) return out;
  const occupied = new Set();
  for (const q of state.pieces) {
    if (q.dead || q.uid === p.uid) continue;
    for (const c of pieceCells(q)) occupied.add(c.x + ',' + c.y);
  }
  const seen = new Set([p.x + ',' + p.y]);
  let frontier = [{ x: p.x, y: p.y }];
  for (let step = 0; step < maxStep; step++) {
    const next = [];
    for (const cur of frontier) {
      for (const [dx, dy] of DIRS) {
        const nx = cur.x + dx, ny = cur.y + dy;
        const key = nx + ',' + ny;
        if (!inBoard(nx, ny) || seen.has(key) || occupied.has(key)) continue;
        seen.add(key);
        if (inLonerZone(nx, ny, p.owner)) continue;
        next.push({ x: nx, y: ny });
        out.push({ x: nx, y: ny });
      }
    }
    frontier = next;
  }
  return out;
}

/* ─────────── 部署 ─────────── */

function baseDeployRows(owner) {
  const rows = [];
  for (let y = 1; y <= H; y++) {
    if (owner === 0 ? y <= 8 : y >= 6) rows.push(y);
  }
  return rows;
}

/**
 * 回合开始时结算“推进许可”：在本方不可部署的行中，
 * 己方该行棋子数 ≥ 对方该行棋子数 + 2，则该行本回合可部署。
 */
function computeExtraRows(state, owner) {
  const base = new Set(baseDeployRows(owner));
  const rows = [];
  for (let y = 1; y <= H; y++) {
    if (base.has(y)) continue;
    let own = 0, opp = 0;
    for (const p of state.pieces) {
      if (p.dead || p.defId === -1) continue;
      if (p.y === y || (p.big && y >= p.y && y <= p.y + 1)) {
        if (p.owner === owner) own++; else opp++;
      }
    }
    if (own >= opp + 2) rows.push(y);
  }
  state.extraRows[owner] = rows;
}

function deployRows(state, owner) {
  const all = baseDeployRows(owner).concat(state.extraRows[owner] || []);
  return new Set(all);
}

/** (x,y) 为锚点能否部署该棋子 */
function canDeployAt(state, defId, owner, x, y) {
  const def = getDef(defId);
  const cells = defId === 5
    ? [{ x, y }, { x: x + 1, y }, { x, y: y + 1 }, { x: x + 1, y: y + 1 }]
    : [{ x, y }];
  const rows = deployRows(state, owner);
  for (const c of cells) {
    if (!inBoard(c.x, c.y)) return false;
    if (!rows.has(c.y)) return false;               // 大肉比跨行的两行都需合法
    if (pieceAt(state, c.x, c.y)) return false;
    if (inLonerZone(c.x, c.y, owner)) return false; // 独行侠禁入圈
  }
  return true;
}

/** 全部合法部署锚点 */
function deployCells(state, defId, owner) {
  const out = [];
  for (let y = 1; y <= H; y++) for (let x = 1; x <= W; x++) {
    if (canDeployAt(state, defId, owner, x, y)) out.push({ x, y });
  }
  return out;
}

/* ─────────── 行动次数 ─────────── */

/** 该棋子本回合的有效行动次数上限 */
function effActions(p) {
  let n = getDef(p.defId).acts;
  if (p.defId === 4) n = 1;                       // 定炮：每回合一次行动（蓄力/开炮）
  if (p.defId === 21) n = 1;                      // 神行千里：蓄气/神行
  if (p.defId === 23) n = p.beatCount % 2 === 0 ? 6 : 0; // 独行侠节拍
  if (p.defId === 12) {                           // 跑得快贴脸惩罚
    for (const q of S.pieces) {
      if (q.dead || q.owner === p.owner) continue;
      if (nearestDist(p, q) === 1) { n -= 1; break; }
    }
  }
  return Math.max(0, n);
}

/** 有效移速 */
function effMv(p) {
  let m = p.mv;
  if (p.defId === 12) {
    for (const q of S.pieces) {
      if (q.dead || q.owner === p.owner) continue;
      if (nearestDist(p, q) === 1) { m -= 1; break; }
    }
  }
  return Math.max(0, m);
}

/* ─────────── 移动 ─────────── */

/** 移动落点集合。特殊：13 号直线三格；5 号整体平移一格（蓄力逻辑在上层）。 */
function moveTargets(state, p) {
  const out = [];
  const occupied = new Set();
  for (const q of state.pieces) {
    if (q.dead || q.uid === p.uid) continue;
    for (const c of pieceCells(q)) occupied.add(c.x + ',' + c.y);
  }

  if (p.defId === 13) {
    // 必须直线恰好三格，途经全空
    for (const [dx, dy] of DIRS) {
      let ok = true;
      for (let i = 1; i <= 3; i++) {
        const nx = p.x + dx * i, ny = p.y + dy * i;
        if (!inBoard(nx, ny) || occupied.has(nx + ',' + ny) || inLonerZone(nx, ny, p.owner)) { ok = false; break; }
      }
      if (ok) out.push({ x: p.x + dx * 3, y: p.y + dy * 3 });
    }
    return out;
  }

  if (p.big) {
    // 2×2 整体平移一格
    for (const [dx, dy] of DIRS) {
      let ok = true;
      for (const c of pieceCells(p)) {
        const nx = c.x + dx, ny = c.y + dy;
        if (!inBoard(nx, ny) || occupied.has(nx + ',' + ny) || inLonerZone(nx, ny, p.owner)) { ok = false; break; }
      }
      if (ok) out.push({ x: p.x + dx, y: p.y + dy });
    }
    return out;
  }

  // 常规 BFS：≤ effMv 步，途经格必须为空（复用通用 BFS）
  return bfsEmptyCells(state, p, effMv(p));
}

/* ─────────── 攻击 ─────────── */

/**
 * 可攻击的敌方单位列表。
 * 穿透规则：对每个候选目标做一次多源 BFS（起点=自身占据格），
 * 把“其他敌方棋子”视为墙体；存在 ≤射程 的路径才可攻击。
 */
function attackTargets(state, p) {
  const out = [];
  if (p.defId === 4 && p.charge < 2) return out;   // 定炮未蓄够力
  const rngEff = p.defId === 4 ? effRange(p) + (p.charge >= 5 ? 1 : 0) : effRange(p); // 蓄满5格射程+1
  const myCells = new Set(pieceCells(p).map((c) => c.x + ',' + c.y));

  const candidates = state.pieces.filter((q) =>
    !q.dead && q.owner !== p.owner &&
    nearestDist(p, q) <= rngEff);

  for (const t of candidates) {
    if (p.defId === 9 && p.hitThisTurn.includes(t.uid)) continue; // 射手不重复打同一目标
    const tKeys = new Set(pieceCells(t).map((c) => c.x + ',' + c.y));
    // 多源 BFS
    const dist = new Map();
    let frontier = [];
    for (const k of myCells) { dist.set(k, 0); frontier.push(k); }
    let reach = -1;
    bfs:
    while (frontier.length) {
      const next = [];
      for (const key of frontier) {
        const d0 = dist.get(key);
        if (d0 >= rngEff) continue;
        const [cx, cy] = key.split(',').map(Number);
        for (const [dx, dy] of DIRS) {
          const nx = cx + dx, ny = cy + dy;
          if (!inBoard(nx, ny)) continue;
          const nk = nx + ',' + ny;
          if (dist.has(nk)) continue;
          if (tKeys.has(nk)) {                     // 抵达目标
            if (d0 + 1 <= rngEff) { reach = d0 + 1; break bfs; }
            continue;
          }
          const occ = pieceAt(state, nx, ny);
          if (occ && occ.owner !== p.owner) continue; // 其他敌方棋子 = 墙
          dist.set(nk, d0 + 1);
          next.push(nk);
        }
      }
      frontier = next;
    }
    if (reach >= 0) out.push(t);
  }
  return out;
}

/** 奶妈的可治疗对象（射程内血量未满的己方） */
function healTargets(state, p) {
  return state.pieces.filter((q) =>
    !q.dead && q.owner === p.owner && q.hp < q.maxHp &&
    nearestDist(p, q) <= effRange(p));
}

/** 24 号厚脸皮：来自正面的伤害至多 10。正面 = 攻击者位于受害者朝前线一侧。 */
function isFrontal(attacker, victim) {
  // victim 的基地在 y=1(owner0) / y=13(owner1)；从前线方向（远离基地一侧）袭来为正面
  return victim.owner === 0 ? attacker.y > victim.y : attacker.y < victim.y;
}


/* ═══════════════ engine.js · 伤害 / 治疗 / 死亡管线 ═══════════════
 * 所有伤害统一经过 dealDamage，依次结算：
 *   金身免疫 → 厚脸皮正面减免 → 策反倒戈 → 扣血 →
 *   投石机标记引爆 → 名刀守护 → 死亡与遗言 → 伤害转化器反弹
 * ═══════════════════════════════════════════════════════════════ */

/** 待结算的死亡遗言队列 */
const pendingDeaths = [];

/**
 * 对目标造成伤害。
 * @param src  来源棋子（可为 null，如法术直接伤害）
 * @param opts {hit:是否为攻击命中, isMark:标记引爆, noCounter:禁止反弹,
 *              noGuard:无视名刀守护, silent:不播受击特效}
 */
async function dealDamage(state, target, amount, src, opts) {
  opts = opts || {};
  if (!target || target.dead || !(amount > 0)) return;

  // ── 金身：不受任何伤害
  if (target.shieldUntil > state.turnCounter) {
    ev('block', { uid: target.uid });
    pushLog(state, `🛡️ ${getDef(target.defId).name} 处于金身状态，免疫了 ${amount} 点伤害！`, 'l-impt');
    return;
  }

  // ── 策反：首次受击时收编攻击者（本次伤害落空）
  if (src && target.charmFrom && state.turnCounter >= target.charmFrom && state.turnCounter < target.charmTo
      && src.owner !== target.owner && src.defId !== -1) {
    target.charmFrom = 0; target.charmTo = 0;
    const oldOwner = src.owner;
    src.owner = target.owner;
    src.apLeft = 0;
    ev('charm', { uid: src.uid });
    pushLog(state, `🎭 策反成功！${PNAME[oldOwner]}的【${getDef(src.defId).name}】临阵倒戈，加入${PNAME[target.owner]}！`, 'l-impt');
    return;
  }

  // ── 厚脸皮：来自正面的攻击伤害至多 10
  let dmg = amount;
  let frontal = false;
  if (src && opts.hit && target.defId === 24 && isFrontal(src, target)) {
    dmg = Math.min(dmg, 10);
    frontal = true;
  }

  target.hp -= dmg;
  ev('damage', { uid: target.uid, amount: dmg, frontal, crit: opts.crit || false });

  // ── 投石机标记：被“标记方另一枚非投石机棋子”再次命中时引爆
  if (opts.hit && src && target.mark10 && !opts.isMark &&
      src.owner === target.mark10.owner && src.defId !== 10 && !target.dead) {
    const mk = target.mark10;
    target.mark10 = null;
    pushLog(state, `🪨 投石机标记被引爆！`);
    await dealDamage(state, target, 5, pieceByUid(state, mk.srcUid), { isMark: true });
  }
  if (target.dead) return;

  // ── 致命伤害：名刀守护
  if (target.hp <= 0) {
    if (!opts.noGuard && !target.guardUsed && hasBladeGuard(state, target)) {
      target.guardUsed = true;
      target.hp = 1;
      ev('guard', { uid: target.uid });
      pushLog(state, `🗡️ 名刀之佑！【${getDef(target.defId).name}】避免了一次致命伤害，以 1 血存活。`, 'l-impt');
      return;
    }
    await killPiece(state, target, src);
    return;
  }

  // ── 伤害转化器：受到友方棋子伤害时反弹等量给射程内敌人
  if (src && target.defId === 16 && src.owner === target.owner && !opts.noCounter) {
    ev('counter', { uid: target.uid });
    pushLog(state, `🔄 伤害转化器将 ${dmg} 点友方伤害转化为反击！`);
    const foes = state.pieces.filter((q) => !q.dead && q.owner !== target.owner &&
                                           nearestDist(target, q) <= effRange(target));
    for (const f of foes) await dealDamage(state, f, dmg, target, { noCounter: true });
  }
}

/** 目标是否有己方名刀（本体形态）守护 */
function hasBladeGuard(state, target) {
  return state.pieces.some((q) => !q.dead && q.defId === 3 && q.owner === target.owner &&
                                  nearestDist(q, target) <= 6);
}

/** 治疗（回满血会引爆投石机标记） */
async function heal(state, target, amount) {
  if (!target || target.dead || !(amount > 0)) return;
  const real = Math.min(amount, target.maxHp - target.hp);
  if (real <= 0) return;
  target.hp += real;
  ev('heal', { uid: target.uid, amount: real });
  // 回满血触发投石机标记
  if (target.hp >= target.maxHp && target.mark10) {
    const mk = target.mark10;
    target.mark10 = null;
    pushLog(state, `🪨 【${getDef(target.defId).name}】回满血，投石机标记引爆！`);
    await dealDamage(state, target, 5, pieceByUid(state, mk.srcUid), { isMark: true });
  }
}

/** 击杀：标记死亡 + 记录遗言 + 杀手升级 */
async function killPiece(state, victim, killer) {
  if (victim.dead) return;
  victim.dead = true;
  victim.hp = 0;
  ev('death', { uid: victim.uid, defId: victim.defId });

  // 杀手击杀升级
  if (killer && !killer.dead && killer.defId === 26 && victim.owner !== killer.owner) {
    killer.killCount++;
    const stage = ((killer.killCount - 1) % 4) + 1;
    if (stage === 1 || stage === 4) {
      killer.maxHp += 10;
      killer.hp = Math.min(killer.maxHp, killer.hp + 10);
      pushLog(state, `🔪 杀手完成第 ${killer.killCount} 杀：+10 血量上限并回复 10 血！（${killer.hp}/${killer.maxHp}）`, 'l-impt');
    } else if (stage === 2) {
      killer.atk += 5;
      pushLog(state, `🔪 杀手完成第 ${killer.killCount} 杀：+5 攻击力！（atk ${killer.atk}）`, 'l-impt');
    } else {
      killer.range += 1;
      pushLog(state, `🔪 杀手完成第 ${killer.killCount} 杀：+1 攻击范围！（射程 ${killer.range}）`, 'l-impt');
    }
    ev('buff', { uid: killer.uid });
  }

  if (getDef(victim.defId).type !== 'base' && getDef(victim.defId).type !== 'grave') {
    pendingDeaths.push({ victim, killer });
  } else if (victim.defId === -1) {
    checkWin(state);
  }
}

/** 逐个结算死亡遗言（可能异步等待玩家选择） */
async function flushDeaths(state) {
  while (pendingDeaths.length) {
    const { victim, killer } = pendingDeaths.shift();
    const fn = DEATHRATTLES[victim.defId];
    if (fn) await fn(state, victim, killer);
  }
}

function checkWin(state) {
  const b0 = state.pieces.find((p) => p.defId === -1 && p.owner === 0);
  const b1 = state.pieces.find((p) => p.defId === -1 && p.owner === 1);
  if (!b0 || !b1) return; // 单元测试等无基地场景不判负
  const d0 = b0.hp <= 0, d1 = b1.hp <= 0;
  if (d0 && d1) { state.winner = 1 - state.curPlayer; }
  else if (d0) { state.winner = 1; }
  else if (d1) { state.winner = 0; }
  if (state.winner != null) {
    state.phase = 'over';
    pushLog(state, `🏆 ${PNAME[state.winner]}摧毁了对方基地，获得胜利！`, 'l-impt');
    ev('win', { winner: state.winner });
  }
}


/* ═══════════════ abilities.js · 主动技能 & 死亡遗言 ═══════════════
 * SKILLS[defId] = {
 *   label   : 界面按钮文字
 *   usable(p)          : 是否可发动
 *   targetSpec(state,p): 选择规格（交给 UI/测试环境解析）
 *   exec(state,p,got)  : got 为玩家选择结果
 * }
 * DEATHRATTLES[defId] = async (state, victim, killer) => {}
 * ═══════════════════════════════════════════════════════════════ */

function foesOf(state, owner) {
  return state.pieces.filter((q) => !q.dead && q.owner !== owner);
}
/** 敌方随从（不含基地） */
function foeFollowers(state, owner) {
  return foesOf(state, owner).filter((q) => getDef(q.defId).type === 'follower' || getDef(q.defId).type === 'grave');
}
/** 己方随从（不含基地） */
function myFollowers(state, owner) {
  return state.pieces.filter((q) => !q.dead && q.owner === owner &&
    (getDef(q.defId).type === 'follower' || getDef(q.defId).type === 'grave'));
}

    ev('hook', { uid: got.uid, fx: p.x, fy: p.y, x0: got.x, y0: got.y, tx: dest.x, ty: dest.y });

/* ── 14 献祭炮 · 献祭齐射 ── */
SKILLS[14] = {
  label: '🔥 献祭齐射',
  usable: () => true,
  targetSpec: (state, p) => ({
    kind: 'piece',
    pieces: myFollowers(state, p.owner).filter((q) => q.uid !== p.uid && nearestDist(p, q) <= effRange(p)),
    hint: '选择要献祭的友方棋子（将扣除你 10 点血量上限）',
  }),
  async exec(state, p, victim) {
    p.maxHp -= 10;
    p.hp = Math.min(p.hp, p.maxHp);
    ev('damage', { uid: p.uid, amount: 0, silentNum: true });
    pushLog(state, `🔥 献祭炮扣除了自己 10 点血量上限（上限 ${p.maxHp}）。`);
    const vAtk = effAtk(victim);
    await killPiece(state, victim, null);
    await flushDeaths(state);
    // 第二段：选一列（射程覆盖的列），点该列任意格代表选列
    const cols = [];
    const rng = effRange(p);
    for (let c = Math.max(1, p.x - rng); c <= Math.min(W, p.x + rng); c++) cols.push(c);
    const colCells = [];
    for (const c of cols) for (let y = 1; y <= H; y++) colCells.push({ x: c, y, col: c });
    const picked = await ENV.choose({
      kind: 'cell', cells: colCells,
      hint: `选择轰击哪一列（对距你最近的敌方造成 ${vAtk} 伤害）`,
    });
    // 该列上最近的敌方单位
    let best = null, bestD = Infinity;
    for (const q of foesOf(state, p.owner)) {
      const covers = q.big ? (picked.col >= q.x && picked.col <= q.x + 1) : q.x === picked.col;
      if (!covers) continue;
      const d = nearestDist(p, q);
      if (d < bestD) { bestD = d; best = q; }
    }
    if (!best) { pushLog(state, `🔥 第 ${picked.col} 列上没有敌方单位，炮击落空……`); return; }
    pushLog(state, `🔥 献祭齐射命中第 ${picked.col} 列的【${getDef(best.defId).name}】，造成 ${vAtk} 伤害！`, 'l-impt');
    await dealDamage(state, best, vAtk, p, { hit: true });
  },
};
